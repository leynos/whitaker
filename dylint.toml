# Whitaker lint configuration
#
# This file configures Whitaker's Dylint-based lints at the workspace level.
# Lint-specific settings are grouped under tables matching the lint name.

[no_std_fs_operations]
# Crates excluded from the capability-based filesystem policy.
#
# The installer is the CLI entry point where ambient filesystem access begins.
# The common crate contains test support utilities that require ambient access
# for fixture management. Use the Rust crate identifier here: `tcx.crate_name()`
# reports `whitaker_common`, not the hyphenated Cargo package name. The
# whitaker_lint_core crate contains the UI test harness which needs ambient
# access to copy compiled lint libraries during test execution.
#
# Integration-test targets compile as their own crates named after the test
# file, so they are not covered by the `whitaker_common` entry above.
# `i18n_packaging` (`common/tests/i18n_packaging.rs`) drives `cargo package`
# and inspects the resulting `target/package` directory; both are ambient by
# construction and cannot be scoped to a `cap_std` root.
#
# The installer's packaging binaries (`whitaker-package-lints`,
# `whitaker-package-installer`, `whitaker-package-dependency-binary`) are
# separate crates from `whitaker_installer`. They write release archives,
# checksums, and manifests to output directories supplied by Cargo or CI, so
# their roots are ambient by construction and cannot be scoped to a `cap_std`
# root.
#
# `whitaker_clippy_snapshot` is the same kind of target: a command-line entry
# point, not library code. Its one flagged call is the debug-only manifest
# override, which reads a path handed in through an environment variable so the
# end-to-end tests can drive every subcommand against a fixture snapshot. An
# env-var path has no parent capability to derive a `Dir` from, and deriving
# one by opening its parent would reproduce exactly the ambient access the
# policy exists to make visible.
#
# The installer's behavioural integration tests each compile as their own crate
# named after the test file. They stage fixture trees, permission-denied
# directories, and packaged archives at ambient temporary paths, and several
# read repository documentation relative to `CARGO_MANIFEST_DIR`. Migrating
# them to `cap_std` would mean re-rooting fixtures the code under test then
# reopens by absolute path, so they are excluded rather than half-migrated.
# The bootstrap, lister, and snapshot suites are the same shape: they stage a
# fake toolchain, swap permission bits, and copy lint bundles under a
# `TempDir`. `whitaker_ls_wrapper` (`installer/tests/whitaker_ls_wrapper.rs`) runs the
# generated `whitaker-ls` script through the real installer against a strict
# fake `cargo` and an installed bootstrap staged under a `TempDir`.
# `dylint_testing` is the vendored upstream test harness (`vendor/dylint_testing`),
# a patched copy of the crates.io crate. It is ambient filesystem code by
# construction, and rewriting it would diverge it further from upstream. It is a
# path dependency of every lint crate, so the dylint wrapper lints it whenever a
# lint crate is selected. `cargo_test_driver` (`vendor/dylint_testing/tests`) is
# that crate's own integration test: it drives a fake Cargo and Nextest on disk
# and is part of the vendored harness, so it falls under the same exemption.
#
# `e2e_check_exit_codes`, `e2e_check_lock` and `e2e_check_streams` drive the
# real `whitaker check` binary against an installed-bootstrap fixture: they
# stage a fake Clippy snapshot, swap permission bits, and place a stub `cargo`
# first on `PATH`, all at ambient temporary roots the fixture hands to the
# binary by absolute path. `e2e_check_support` is the shared fixture module all
# three compile in, so its ambient calls appear under each crate's name and are
# covered by the same entries.
# Crates behind `#![cfg(windows)]` need no entry: the lint walks post-expansion
# HIR, so on this Linux gate their items are already gone.
excluded_crates = [
    "whitaker_installer",
    "whitaker_common",
    "whitaker_lint_core",
    "i18n_packaging",
    "whitaker_package_lints",
    "whitaker_package_installer",
    "whitaker_package_dependency_binary",
    "whitaker_clippy_snapshot",
    "behaviour_artefact_packaging",
    "behaviour_cli",
    "behaviour_docs",
    "behaviour_install_metrics",
    "behaviour_installer_release",
    "behaviour_packaging_cli",
    "behaviour_prebuilt",
    "behaviour_staging",
    "behaviour_toolchain",
    "behaviour_workflows",
    "bootstrap_properties",
    "bootstrap_run",
    "clippy_snapshot_cli",
    "whitaker_ls_wrapper",
    "dylint_testing",
    "cargo_test_driver",
    "e2e_check_exit_codes",
    "e2e_check_lock",
    "e2e_check_streams",
    "behaviour_whitaker_check",
    "behaviour_check_repair",
]

# Module-scoped rather than crate-wide, so the policy still covers the crate's
# production code. This test module captures `tracing` output by writing to an
# anonymous `tempfile::tempfile()` and rewinding it; that handle has no parent
# capability to scope a `Dir` to, so the ambient `File` operations are inherent
# to how the capture works rather than a shortcut. The module is declared as
# `mod tests`, so the configured path names it accordingly.
#
# `whitaker::diagnostics::tests` is the same shape: it captures formatted
# `tracing` output through an anonymous `tempfile::tempfile()` handle.
#
# `whitaker::adapters::library_path::listing` is the read-only seam that stats
# and lists a Dylint library path, including the directories the installation
# record names by absolute path. It uses `std::fs::metadata` so a symlinked data
# directory resolves as it always has: `cap_std` rejects absolute symlink
# targets, so migrating the call would reclassify a symlinked data directory as
# unusable. `candidates` asks this seam rather than calling `std::fs` itself, so
# the exemption follows the code. Only these read-only modules are exempt; the
# rules in `src/library_path` judge the reports and still perform no I/O.
#
# `ui::harness_lock` (with its nested lock-path and test modules) is the example
# harness lock of `rstest_helper_should_be_fixture`'s `tests/ui.rs`: lock
# directories, owner files and the child's collection summary live at ambient
# temporary paths shared between nextest processes. No other test target has a
# `harness_lock` module, so the path names that one target, where a crate-level
# entry for `ui` would exempt every `tests/ui.rs` in the workspace.
#
# A `Dir`-rooted lock was tried and kept out. Locking works (a lock file made
# through the `Dir`, `into_std()`, then `File::lock`/`try_lock`: a second handle
# gets `WouldBlock`). Paths do not: `Dir::canonicalize` returns paths relative
# to the `Dir` and rejects an absolute path ("a path led outside of the
# filesystem"), while this protocol shares absolute, canonical lock paths with
# child processes and compares them in its tests, and the Cargo target
# directories it resolves can sit behind symlinks, which `cap_std` rejects when
# they are absolute (the reason `library_path::candidates` is exempt too).
#
# `whitaker::adapters::check::tests` stages the whole `check` fixture set —
# fake installations, snapshot bundles, stub `cargo` scripts and permission
# bits — under ambient temporary directories that the adapter reopens by
# absolute path. It is `cfg(test)`-only, so the production adapter is still
# covered.
#
# `whitaker::cli::check::tests` is the command layer's scripted-port fixture:
# it stages a real suite library and an installed-bootstrap tree under a
# `TempDir` so the port can hand out a genuinely inspected prepared value. It
# is `cfg(test)`-only.
excluded_paths = [
    "whitaker_clones_core::ast::lowering_diagnostics::tests",
    "whitaker::diagnostics::tests",
    "whitaker::adapters::library_path::listing",
    "whitaker::adapters::check::tests",
    "whitaker::cli::check::tests",
    "ui::harness_lock",
]

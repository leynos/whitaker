name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push to main. This workflow owns
# the CodeScene surface entirely: no pull-request lane uploads, runs the
# changed-line check, or holds the credential (see the note in ci.yml and
# "Who may talk to CodeScene" in the developers' guide). `workflow_dispatch`
# allows a manual re-run: automerge merges performed with GITHUB_TOKEN do
# not fire push-event workflows, so dispatch is the fallback path for
# uploading coverage from main, and the upload step's ref test keeps a
# dispatch from any other branch from uploading.
#
# No concurrency group cancels a run here. A cancelled run abandons its
# upload and the cache state it writes; runs that overlap both finish, and
# the later push's state wins.
#
# Coverage is generated via `make coverage`, which reuses the `make test`
# recipe (same crate-exclusion set and prefer-dynamic RUSTFLAGS) with a
# `cargo llvm-cov nextest` driver. The shared `generate-coverage` action is
# deliberately not used: it hard-codes `cargo llvm-cov --workspace` with no
# way to exclude crates, and whitaker's suite cannot run a bare
# `--workspace` build (eleven crates are excluded from CI test runs and the
# dylint UI tests need per-target RUSTFLAGS).
#
# This job is the writer for every coverage-lane cache key and for the
# instrumented compiler-cache shape. `ci.yml`'s `coverage-check` restores
# those keys and never saves. `ci.yml`'s `linux-full` also runs on push to
# `main`, as the writer for the lint lane's keys and shapes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PROFILE: debug
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Keep in step with ci.yml, whose `coverage-check` this job writes for. The
  # `make` recipes set RUSTFLAGS themselves, but `make test-doc` takes
  # RUSTDOCFLAGS from here, so without it `main`'s doctests would tolerate
  # warnings a pull request's reject. `trunk_writer_environment_contract_test`
  # holds the two alike.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Keep in step with ci.yml: one named constant for the Ubicloud shape.
  LINUX_RUNNER_VCPUS: '2'
  # One-line switch between the Actions cache backend and a cached local
  # directory. `gha` is deployed. It reaches Ubicloud's own cache proxy rather
  # than GitHub's cache service, because "Export the Ubicloud cache
  # credentials" below publishes the proxy address and clears the v2
  # cache-service flag the proxy does not serve. The earlier `gha` attempt
  # that failed every store attempt lacked that step; see the longer note in
  # ci.yml, scripts/select-sccache-backend.sh and the developers' guide. Keep
  # in step with ci.yml: this lane writes the compiler cache the pull-request
  # lanes read, so a split between the two files would leave each reading a
  # store the other never wrote.
  SCCACHE_BACKEND: gha
  # RUSTC_WRAPPER is deliberately absent. The shared Rust setup action now
  # exports it as the absolute path of the sccache it installed, and stands
  # aside when a caller has already set the variable, so a value here would
  # leave every lane wrapped by whichever sccache is on PATH. The zero-request
  # failure of run 33692863541 predates that export; the wrapper reaches every
  # Cargo invocation, including the nested build `cargo llvm-cov` launches,
  # because it is inherited from the job environment either way.

jobs:
  coverage-upload:
    runs-on: ubicloud-standard-2-ubuntu-2404
    # Above the 45 m nextest global timeout plus a cold build and the work
    # either side of the suite; kept in step with ci.yml's coverage lane.
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Bound concurrency to the runner shape
        run: |
          {
            printf 'CARGO_BUILD_JOBS=%s\n' "${LINUX_RUNNER_VCPUS}"
            printf 'NEXTEST_TEST_THREADS=%s\n' "${LINUX_RUNNER_VCPUS}"
          } >> "$GITHUB_ENV"

      - name: Export the Ubicloud cache credentials
        # The runner hands `ACTIONS_CACHE_URL` and `ACTIONS_RUNTIME_TOKEN` to
        # action steps, and this republishes them through `GITHUB_ENV` with the
        # v2 cache-service flag cleared, because Ubicloud's proxy serves v1. An
        # sccache server started without them binds local disk for the whole
        # job and reports a plausible hit rate for a store nothing archives.
        # It must precede the selector and every later step, because sccache
        # binds its backend once, when its server starts.
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@dbe2e22ceaf498d85512679ccded38be9dbe7777

      - name: Select the compiler cache backend
        run: bash scripts/select-sccache-backend.sh

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Restore the Rust toolchain and installed tools
        id: rust-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
          key: tools-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-ubuntu2404-nextest0.9.114-llvmcov0.6.24-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the Clippy source mirror
        id: clippy-mirror-cache
        # `dylint_driver`'s build script clones rust-lang/rust-clippy while
        # building. Run 33704041072 failed three times because GitHub
        # rejected that unauthenticated clone. Give the fetch one cache
        # owner, keyed by the Dylint version whose build script performs it
        # and by the pinned nightly whose revision it needs.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-mirrors
          key: clippy-mirror-v1-dylint6.0.1-${{ hashFiles('rust-toolchain.toml') }}

      - name: Record cache observations
        if: always()
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_MATCHED: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
          RUST_TOOLS_KEY: ${{ steps.rust-tools.outputs.cache-primary-key }}
          RUST_TOOLS_MATCHED: ${{ steps.rust-tools.outputs.cache-matched-key }}
          RUST_TOOLS_HIT: ${{ steps.rust-tools.outputs.cache-hit }}
          CLIPPY_MIRROR_KEY: ${{ steps.clippy-mirror-cache.outputs.cache-primary-key }}
          CLIPPY_MIRROR_MATCHED: ${{ steps.clippy-mirror-cache.outputs.cache-matched-key }}
          CLIPPY_MIRROR_HIT: ${{ steps.clippy-mirror-cache.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Provision the Clippy source mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/provision-clippy-mirror.sh \
            "$HOME/.cache/whitaker-mirrors/rust-clippy.git"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7cb894fe62c40951cccf33819548095e64a1291e
        with:
          cache-provider: external

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: cargo-llvm-cov@0.6.24
          fallback: none

      - name: Generate coverage
        run: make coverage

      - name: Discard the instrumented target tree
        # `cargo llvm-cov` has already written lcov.info, and no job caches a
        # target tree, so this is the largest piece of pure scratch on the
        # disk. Removing it before the doctest build and before the saves is
        # what keeps a save from dying on `No space left on device`: the cache
        # action stages a compressed archive locally before uploading it.
        if: always()
        run: rm -rf target/llvm-cov-target

      - name: Run doctests
        # `cargo llvm-cov nextest` executes no doctests and `--all-targets`
        # excludes them, so this is the only step in the repository that runs
        # them. It is the second half of one executed set, not a second lane.
        run: make test-doc

      - name: Record sccache effectiveness
        if: always()
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-coverage-upload
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      # Publishes whether the token exists, and nothing else. The token is
      # in no `env` on this workflow: the upload is a composite action, and a
      # composite action's nested steps inherit the calling step's `env`, so
      # a token bound there reached every one of them. GitHub evaluates the
      # expression before the shell starts, so the token enters no process.
      - name: Check CodeScene token availability
        id: codescene_token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # `workflow_dispatch` can name any branch, so the trigger filter does
        # not confine this upload to the trunk; the ref test here does.
        if: steps.codescene_token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: lcov
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

      - name: Record disk headroom before the saves
        if: always()
        run: bash scripts/record-cache-observations.sh headroom

      # This job is the sole writer for the coverage-lane keys and for the
      # shared Clippy mirror. `ci.yml` restores them and never saves, so two
      # lanes can never race to populate the same cold key.
      - name: Save Cargo registry
        if: github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

      - name: Save the Rust toolchain and installed tools
        if: github.ref == 'refs/heads/main' && steps.rust-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ steps.rust-tools.outputs.cache-primary-key }}

      - name: Save the Clippy source mirror
        if: github.ref == 'refs/heads/main' && steps.clippy-mirror-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-mirrors
          key: ${{ steps.clippy-mirror-cache.outputs.cache-primary-key }}

      - name: Check sccache health
        # Last, so a failure here cannot cost the job its cache saves; the
        # statistics were uploaded earlier either way.
        run: python3 scripts/check_sccache_health.py --expect-location ghac sccache-stats.json

name: Rolling Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_dependency_binary_rebuild:
        description: Force a dependency binary rebuild for rolling-release recovery.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The Linux legs cache compiler output in a directory this workflow
  # owns, rather than in the Actions cache service. One declaration, read
  # by scripts/select-sccache-backend.sh, so the two backends can never be
  # configured at once.
  SCCACHE_BACKEND: local
  LINT_CRATES: >-
    bumpy_road_function
    conditional_max_n_branches
    function_attrs_follow_docs
    module_max_lines
    module_must_have_inner_docs
    no_expect_outside_tests
    test_must_not_have_example
    no_std_fs_operations
    no_unwrap_or_else_panic
    whitaker_suite

jobs:
  dependency-manifest-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Check whether dependency manifest changed
        id: check
        run: |
          set -euxo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.force_dependency_binary_rebuild }}" == "true" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- installer/dependency-binaries.toml; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Self-heal: even when the manifest is unchanged, rebuild if any
          # expected dependency archive is absent from the rolling release
          # (for example after a build failure on the one push that changed
          # the manifest). Without this probe the gate can never recover.
          scripts/check_dependency_binary_assets.py --release rolling
        env:
          GH_TOKEN: ${{ github.token }}

  build-lints:
    runs-on: ${{ matrix.os }}
    # Ubicloud runners register as self-hosted just-in-time runners, so
    # GitHub's five-day self-hosted ceiling applies rather than the six-hour
    # hosted one, and a hung leg would bill for days. The slowest leg of this
    # job in the last green run was 222 s, so this is about eight times the
    # observed worst case: wide enough not to fire on a cold cache, narrow
    # enough to be a bound.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # The x86_64 image is load-bearing, not a default. Every consumer of
          # whitaker's Linux binaries inherits the glibc this leg links
          # against, and the "Check glibc baseline" step below holds it at
          # GLIBC_2.35, which is 22.04's. Moving this leg to a newer image
          # raises the floor for every consumer at once.
          - target: x86_64-unknown-linux-gnu
            os: ubicloud-standard-2-ubuntu-2204
          # The arm64 leg keeps the 24.04 image it has always built on, so
          # this placement move changes where it runs and not what it links
          # against. No baseline check runs here; see the developers' guide.
          - target: aarch64-unknown-linux-gnu
            os: ubicloud-standard-2-arm-ubuntu-2404
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      RUSTFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Export the Ubicloud cache credentials
        # The Linux legs' cache archives would otherwise go to the wrong
        # store. `setup-rust` runs `mozilla-actions/sccache-action`, which
        # writes `ACTIONS_CACHE_SERVICE_V2=on` and GitHub's results address
        # to `GITHUB_ENV`, and it puts back only a value that was set before
        # it ran. Without this step the variable was unset, so every save
        # after `Setup Rust` went to GitHub's v2 service while every restore
        # before it read Ubicloud's proxy: each run restored nothing and
        # saved an archive no restore could see. Clearing the flag here gives
        # `setup-rust` a value to put back, so the saves reach the proxy too.
        # Linux only, because the action fails closed on a GitHub-hosted
        # runner, and the macOS and Windows legs are GitHub-hosted.
        if: runner.os == 'Linux'
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@dbe2e22ceaf498d85512679ccded38be9dbe7777

      # Only the two Linux legs are on Ubicloud and only they cache. The
      # macOS and Windows legs keep the wiring they have always had, which is
      # whatever the shared action provides for them.
      - name: Select the compiler cache backend
        if: runner.os == 'Linux'
        run: bash scripts/select-sccache-backend.sh

      - name: Restore Cargo registry
        id: cargo-registry
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-rolling-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-rolling-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Restore the compiler cache directory
        id: sccache-dir
        if: runner.os == 'Linux' && env.SCCACHE_BACKEND == 'local'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/sccache
          key: sccache-rolling-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-rolling-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Record cache observations
        if: always() && runner.os == 'Linux'
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_MATCHED: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
          SCCACHE_DIR_KEY: ${{ steps.sccache-dir.outputs.cache-primary-key }}
          SCCACHE_DIR_MATCHED: ${{ steps.sccache-dir.outputs.cache-matched-key }}
          SCCACHE_DIR_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      # "external" hands cache ownership to the restore and save steps above
      # and below. The other three legs keep the action's built-in caches,
      # because nothing here owns one for them.
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7cb894fe62c40951cccf33819548095e64a1291e
        with:
          cache-provider: ${{ runner.os == 'Linux' && 'external' || 'github' }}

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F '"' '/^channel/ {print $2}' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install pinned toolchain components
        run: |
          set -euxo pipefail
          TOOLCHAIN="${{ steps.toolchain.outputs.channel }}"
          rustup target add --toolchain "${TOOLCHAIN}" "${{ matrix.target }}"
          # rustc-dev payloads already include rustc-src files and can conflict
          # with a separate rust-src install on some targets.
          rustup component add --toolchain "${TOOLCHAIN}" --target "${{ matrix.target }}" rustc-dev llvm-tools-preview

      - name: Build lint crates
        run: |
          set -euxo pipefail
          TOOLCHAIN="${{ steps.toolchain.outputs.channel }}"
          for lint in $LINT_CRATES; do
            RUSTFLAGS="${RUSTFLAGS}" \
              cargo "+${TOOLCHAIN}" build \
                --release \
                --features dylint-driver \
                -p "$lint" \
                --target "${{ matrix.target }}"
          done

      - name: Diagnostics (build lint crates)
        if: failure()
        run: |
          set -euxo pipefail
          TOOLCHAIN="${{ steps.toolchain.outputs.channel }}"
          rustup show
          rustup component list --toolchain "${TOOLCHAIN}" --installed
          ls -lah "target/${{ matrix.target }}/release" || true

      - name: Determine git SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build packaging tool
        run: cargo build --release -p whitaker-installer --bin whitaker-package-lints

      - name: Package artefact
        run: |
          set -euxo pipefail
          mkdir -p dist
          ./target/release/whitaker-package-lints \
            --git-sha "${{ steps.sha.outputs.short }}" \
            --toolchain "${{ steps.toolchain.outputs.channel }}" \
            --target "${{ matrix.target }}" \
            --output-dir dist \
            --release-dir "target/${{ matrix.target }}/release"

      - name: Check glibc baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euxo pipefail
          shopt -s nullglob
          lint_libraries=(target/${{ matrix.target }}/release/*.so)
          if [[ "${#lint_libraries[@]}" -eq 0 ]]; then
            echo "::error::No x86_64 Linux lint libraries were built."
            exit 1
          fi
          scripts/check_glibc_baseline.py --maximum-glibc GLIBC_2.35 \
            "${lint_libraries[@]}"

      - name: Diagnostics (package artefact)
        if: failure()
        run: |
          set -euxo pipefail
          ls -lah "target/${{ matrix.target }}/release" || true
          ls -lah dist || true

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: lints-${{ matrix.target }}
          path: |
            dist/*.tar.zst
            dist/manifest-*.json
          retention-days: 1

      # The artefact is uploaded by here, so the target tree is expendable.
      # Discarding it before the saves keeps compiler output out of the
      # archives, which sccache already owns, and frees the headroom the save
      # steps need to stage their archives.
      - name: Discard the build target tree
        if: always() && runner.os == 'Linux'
        run: rm -rf target

      - name: Record sccache effectiveness
        if: always() && runner.os == 'Linux'
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Record disk headroom before the saves
        if: always() && runner.os == 'Linux'
        run: bash scripts/record-cache-observations.sh headroom

      - name: Save Cargo registry
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

      - name: Save the compiler cache directory
        if: runner.os == 'Linux' && env.SCCACHE_BACKEND == 'local' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/sccache
          key: ${{ steps.sccache-dir.outputs.cache-primary-key }}

  build-dependency-binaries:
    needs: dependency-manifest-changes
    if: needs.dependency-manifest-changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    # As above. This job installs every dependency crate from source, so it is
    # the heavier of the two: its slowest leg on the last release run that
    # built it was 592 s, and this is about four and a half times that.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for the same reason as the lints legs: this job's own
          # "Check glibc baseline" step holds these binaries at GLIBC_2.35,
          # and consumers install them alongside the lint libraries.
          - target: x86_64-unknown-linux-gnu
            os: ubicloud-standard-2-ubuntu-2204
          # The arm64 leg keeps the 24.04 image family it has always used.
          - target: aarch64-unknown-linux-gnu
            os: ubicloud-standard-2-arm-ubuntu-2404
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Export the Ubicloud cache credentials
        # As in build-lints: without it every save after `Setup Rust` goes to
        # GitHub's v2 service while every restore reads Ubicloud's proxy.
        if: runner.os == 'Linux'
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@dbe2e22ceaf498d85512679ccded38be9dbe7777

      # As in build-lints: only the two Linux legs are on Ubicloud and only
      # they cache. This job installs every dependency crate from source with
      # `cargo install --locked`, so its registry and compiler caches are
      # worth more here than anywhere else in the workflow.
      - name: Select the compiler cache backend
        if: runner.os == 'Linux'
        run: bash scripts/select-sccache-backend.sh

      - name: Restore Cargo registry
        id: cargo-registry
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-depbin-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('installer/dependency-binaries.toml') }}
          restore-keys: |
            cargo-registry-depbin-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Restore the compiler cache directory
        id: sccache-dir
        if: runner.os == 'Linux' && env.SCCACHE_BACKEND == 'local'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/sccache
          key: sccache-depbin-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('installer/dependency-binaries.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-depbin-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('installer/dependency-binaries.toml') }}-

      - name: Record cache observations
        if: always() && runner.os == 'Linux'
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_MATCHED: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
          SCCACHE_DIR_KEY: ${{ steps.sccache-dir.outputs.cache-primary-key }}
          SCCACHE_DIR_MATCHED: ${{ steps.sccache-dir.outputs.cache-matched-key }}
          SCCACHE_DIR_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7cb894fe62c40951cccf33819548095e64a1291e
        with:
          cache-provider: ${{ runner.os == 'Linux' && 'external' || 'github' }}

      - name: Add target
        run: rustup target add "${{ matrix.target }}"

      # The dependency tools' locked dependencies can require a newer rustc
      # than the repository's pinned nightly (cargo-dylint 6.0.1 locks
      # cargo-util 0.2.28, which needs rustc 1.93), so host-tool installs run
      # under a current stable toolchain.
      - name: Install stable toolchain for host tools
        run: |
          set -euxo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable "${{ matrix.target }}"

      - name: Build dependency packaging tool
        run: cargo build --release -p whitaker-installer --bin whitaker-package-dependency-binary

      - name: Build and package dependency binaries
        run: |
          set -euxo pipefail
          mkdir -p dist
          mkdir -p dependency-root
          installer/scripts/dependency_binaries_manifest.py --output /tmp/dependency-binaries.tsv
          # shellcheck disable=SC2193 # GitHub expands matrix.target at runtime.
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            PACKAGER="./target/release/whitaker-package-dependency-binary.exe"
          else
            PACKAGER="./target/release/whitaker-package-dependency-binary"
          fi
          while IFS=$'\t' read -r package binary version; do
            cargo +stable install \
              --locked \
              --force \
              --root dependency-root \
              --target "${{ matrix.target }}" \
              --version "$version" \
              "$package"
            # shellcheck disable=SC2193 # GitHub expands matrix.target at runtime.
            if [[ "${{ matrix.target }}" == *windows* ]]; then
              executable="dependency-root/bin/${binary}.exe"
            else
              executable="dependency-root/bin/${binary}"
            fi
            "$PACKAGER" package \
              --package "$package" \
              --target "${{ matrix.target }}" \
              --binary-path "$executable" \
              --output-dir dist
          done < /tmp/dependency-binaries.tsv

      - name: Check glibc baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euxo pipefail
          installer/scripts/dependency_binaries_manifest.py --output /tmp/dependency-binaries.tsv
          binaries=()
          while IFS=$'\t' read -r _package binary _version; do
            binaries+=("dependency-root/bin/${binary}")
          done < /tmp/dependency-binaries.tsv
          scripts/check_glibc_baseline.py --maximum-glibc GLIBC_2.35 \
            "${binaries[@]}"

      - name: Generate SHA-256 checksums
        run: |
          set -euxo pipefail
          for file in dist/*.tgz dist/*.zip; do
            if [[ -f "$file" ]]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$file" > "${file}.sha256"
              else
                shasum -a 256 "$file" > "${file}.sha256"
              fi
            fi
          done

      - name: Diagnostics (dependency binaries)
        if: failure()
        run: |
          set -euxo pipefail
          ls -lah dependency-root/bin || true
          ls -lah dist || true

      - name: Upload dependency artefact
        uses: actions/upload-artifact@v7
        with:
          name: dependency-binaries-${{ matrix.target }}
          path: |
            dist/*.tgz
            dist/*.zip
            dist/*.sha256
          retention-days: 1

      # The artefact is uploaded, so both scratch trees are expendable. This
      # job has two: `target` from the packaging tool, and `dependency-root`
      # where `cargo install` stages the binaries it has already packaged.
      - name: Discard the build target tree
        if: always() && runner.os == 'Linux'
        run: rm -rf target dependency-root

      - name: Record sccache effectiveness
        if: always() && runner.os == 'Linux'
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Record disk headroom before the saves
        if: always() && runner.os == 'Linux'
        run: bash scripts/record-cache-observations.sh headroom

      - name: Save Cargo registry
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

      - name: Save the compiler cache directory
        if: runner.os == 'Linux' && env.SCCACHE_BACKEND == 'local' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/sccache
          key: ${{ steps.sccache-dir.outputs.cache-primary-key }}

  publish:
    if: always()
    needs:
      - dependency-manifest-changes
      - build-lints
      - build-dependency-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7cb894fe62c40951cccf33819548095e64a1291e

      - name: Build dependency packaging tool
        run: cargo build --release -p whitaker-installer --bin whitaker-package-dependency-binary

      # No "restore the dependency archives" step. They are only rebuilt
      # when the dependency manifest changes; the rest of the time they are
      # already published, and the release is no longer destroyed, so
      # downloading them in order to upload them again would replace assets
      # that never changed. `gh release upload --clobber` deletes before it
      # uploads, so that round trip was itself a window on precisely the
      # assets a consumer needs.
      - name: Download all artefacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: lints-*
          merge-multiple: true
          path: dist

      - name: Download dependency artefacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: dependency-binaries-*
          merge-multiple: true
          path: dist

      # A manual force request is a recovery operation. Do not let a partial
      # matrix or a tolerant download replace the published rolling assets.
      - name: Check forced rebuild before publication
        id: forced_rebuild
        run: bash scripts/check-forced-rolling-assets.sh
        env:
          FORCE_DEPENDENCY_BINARY_REBUILD: ${{ github.event.inputs.force_dependency_binary_rebuild }}
          LINT_BUILD_RESULT: ${{ needs.build-lints.result }}
          DEPENDENCY_BUILD_RESULT: ${{ needs.build-dependency-binaries.result }}

      - name: List artefacts
        run: |
          if [[ ! -d dist ]]; then
            echo "No artefacts were downloaded."
            exit 0
          fi
          ls -lh dist/

      - name: Check whether release assets are available
        id: assets
        run: |
          set -euxo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.zst dist/manifest-*.json dist/*.tgz dist/*.zip dist/*.sha256)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${assets[@]}" > dist/release-assets.txt
          echo "has_assets=true" >> "$GITHUB_OUTPUT"

      - name: Check whether dependency assets are available
        id: dependency_assets
        run: |
          set -euxo pipefail
          shopt -s nullglob
          dep_assets=(dist/*.tgz dist/*.zip)
          if [[ "${#dep_assets[@]}" -eq 0 ]]; then
            echo "has_dependency_assets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_dependency_assets=true" >> "$GITHUB_OUTPUT"

      - name: Generate dependency provenance asset
        if: steps.dependency_assets.outputs.has_dependency_assets == 'true'
        run: |
          set -euxo pipefail
          ./target/release/whitaker-package-dependency-binary provenance --output-dir dist
          printf '%s\n' "dist/dependency-binaries-licences.md" >> dist/release-assets.txt

      # One step, not two. The previous delete-then-create pair left the
      # rolling tag, its release and every asset absent for six to seven
      # seconds on each publish, and a consumer landed in that gap.
      - name: Republish the rolling release in place
        if: steps.assets.outputs.has_assets == 'true' && steps.forced_rebuild.outcome == 'success'
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD) \
          RELEASE_SHORT_SHA=$(git rev-parse --short HEAD) \
            bash scripts/publish-rolling-release.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Skip release publish when no assets were built
        if: steps.assets.outputs.has_assets != 'true'
        run: |
          echo "No rolling-release assets were produced by the build jobs."
          echo "Skipping release publication."

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PROFILE: debug
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # `make check-fmt` shells out to both Markdown formatters. Keep CI on the
  # same releases used to normalize the checked-in documentation.
  MDTABLEFIX_VERSION: '0.5.0'
  MDTABLEFIX_LINUX_X64_SHA256: bd38cd30f0405120c453b3e80b0d4e78a34d93d2c2121a0fd4ace4a54bacaeeb
  MARKDOWNLINT_CLI2_VERSION: '0.20.0'
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  RUSTC_WRAPPER: sccache
# CodeScene coverage: main-branch coverage is uploaded by
# coverage-main.yml on push. The pull-request changed-line gate runs in
# the coverage-check job below via `mode: check` against the same
# `make coverage` lcov.info that coverage-main.yml generates.
jobs:
  coverage-check:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-rust-linux-light;overrides.cache-tag=whitaker-linux-amd64-v1
    env:
      NEXTEST_TEST_THREADS: 2
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Namespace cache
        id: namespace-cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547  # v1
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            ~/.cache/sccache
            ~/.cache/uv
            ~/.local/bin
            ~/.local/share/uv

      - name: Record Namespace cache state
        env:
          NAMESPACE_CACHE_HIT: ${{ steps.namespace-cache.outputs.cache-hit }}
        run: |
          {
            printf '### Cache observations\n\n'
            printf -- "- Cache tag: \`whitaker-linux-amd64-v1\`\n"
            printf -- "- Namespace volume hit: \`%s\`\n" "${NAMESPACE_CACHE_HIT}"
            printf -- '- Archive restore/save: not applicable; Namespace exposes the volume locally.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@5daae0a332441d170d88ca648c9e71f0bbe96cb3
        with:
          cache-provider: external
          use-sccache: false

      - name: Install sccache
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: sccache@0.16.0
          fallback: none

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: cargo-llvm-cov@0.6.24
          fallback: none

      - name: Reset sccache statistics
        run: sccache --zero-stats

      - name: Generate coverage
        run: make coverage

      - name: Record sccache effectiveness
        if: always()
        run: |
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          {
            printf '### sccache\n\n```text\n'
            cat sccache-stats.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-coverage-check
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'pull_request' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@32c8ea649ea44d40119f348ad48861212532061f
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/71836
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  linux-full:
    runs-on: namespace-profile-rust-linux-ci;overrides.cache-tag=whitaker-linux-amd64-v1
    env:
      NEXTEST_TEST_THREADS: 4
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Namespace cache
        id: namespace-cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547  # v1
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            ~/.cache/cargo-binstall
            ~/.cache/sccache
            ~/.cache/uv
            ~/.local/bin
            ~/.local/share/uv

      - name: Record Namespace cache state
        env:
          NAMESPACE_CACHE_HIT: ${{ steps.namespace-cache.outputs.cache-hit }}
        run: |
          {
            printf '### Cache observations\n\n'
            printf -- "- Cache tag: \`whitaker-linux-amd64-v1\`\n"
            printf -- "- Namespace volume hit: \`%s\`\n" "${NAMESPACE_CACHE_HIT}"
            printf -- '- Archive restore/save: not applicable; Namespace exposes the volume locally.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Verus FragmentId bridge
        run: scripts/check-verus-fragment-id-bridge.sh

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@5daae0a332441d170d88ca648c9e71f0bbe96cb3
        with:
          cache-provider: external
          use-sccache: false

      - name: Install sccache
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: sccache@0.16.0
          fallback: none

      - name: Reset sccache statistics
        run: sccache --zero-stats

      - name: Setup Rust for installer MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: '1.85.0'

      - name: Installer MSRV check
        run: make installer-msrv-check

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'

      - name: Install mdtablefix
        # `make check-fmt` needs the exact release that defines the repository's
        # canonical Markdown output, even when the cache restores an older binary.
        run: |
          expected_mdtablefix_version="mdtablefix ${MDTABLEFIX_VERSION}"
          installed_mdtablefix_version=""
          if command -v mdtablefix >/dev/null 2>&1; then
            installed_mdtablefix_version="$(mdtablefix --version 2>/dev/null | tr -d '\r')"
          fi
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            download="${RUNNER_TEMP}/mdtablefix-linux-x86_64"
            destination="${HOME}/.cargo/bin/mdtablefix"
            url="https://github.com/leynos/mdtablefix/releases/download/v${MDTABLEFIX_VERSION}/mdtablefix-linux-x86_64"
            curl --fail --location --proto '=https' --tlsv1.2 "${url}" -o "${download}"
            echo "${MDTABLEFIX_LINUX_X64_SHA256}  ${download}" \
              | sha256sum --check --status
            mkdir -p "$(dirname "${destination}")"
            install -m 0755 "${download}" "${destination}.new"
            mv "${destination}.new" "${destination}"
          fi
          installed_mdtablefix_version="$(mdtablefix --version | tr -d '\r')"
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            echo "expected ${expected_mdtablefix_version}, got ${installed_mdtablefix_version}" >&2
            exit 1
          fi

      - name: Install Markdown lint CLI
        # Match the lint-fixing pass that `make fmt` and `make check-fmt` share.
        run: |
          bun install --no-progress --global "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          markdownlint_version_output="$(markdownlint-cli2 --version)"
          installed_markdownlint_version="${markdownlint_version_output%%$'\n'*}"
          expected_markdownlint_version="markdownlint-cli2 v${MARKDOWNLINT_CLI2_VERSION}"
          if [[ "${installed_markdownlint_version}" != "${expected_markdownlint_version}"* ]]; then
            echo "expected ${expected_markdownlint_version}, got ${installed_markdownlint_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: make check-fmt

      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: '0.11.19'

      - name: GLIBC baseline checker
        run: make test-glibc-baseline

      - name: Install Merman CLI
        run: |
          expected_merman_version="merman-cli 0.7.0"
          installed_merman_version=""
          if command -v merman-cli >/dev/null 2>&1; then
            installed_merman_version="$(merman-cli --version 2>/dev/null | tr -d '\r')"
          fi
          if [[ "${installed_merman_version}" != "${expected_merman_version}" ]]; then
            archive="merman-cli-x86_64-unknown-linux-gnu.tar.xz"
            archive_url="https://github.com/Latias94/merman/releases/download/v0.7.0/${archive}"
            expected_sha256="dfdc2a978a884aa5a2ad5b85285fb5175cb435e82cf96efa860a550749e09d99"
            install_directory="$(mktemp -d)"
            trap 'find "${install_directory}" -depth -delete' EXIT
            curl --fail --location --silent --show-error \
              --output "${install_directory}/${archive}" "${archive_url}"
            printf '%s  %s\n' "${expected_sha256}" "${install_directory}/${archive}" \
              | sha256sum --check
            tar -xJf "${install_directory}/${archive}" -C "${install_directory}"
            install -m 0755 \
              "${install_directory}/merman-cli-x86_64-unknown-linux-gnu/merman-cli" \
              "${HOME}/.cargo/bin/merman-cli"
          fi
          installed_merman_version="$(merman-cli --version | tr -d '\r')"
          if [[ "${installed_merman_version}" != "${expected_merman_version}" ]]; then
            echo "expected ${expected_merman_version}, got ${installed_merman_version}" >&2
            exit 1
          fi

      - name: Install Nixie
        run: uv tool install --python 3.14 "nixie-cli==1.1.0"

      - name: Enforce en-GB-oxendict spelling
        run: make spelling

      - name: Nixie
        run: make nixie

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md
            !**/.uv-cache/**
            !**/.uv-tools/**

      - name: Lint
        run: make lint

      - name: Workflow contract tests
        run: make test-workflow-contracts

      - name: Publish dry run
        run: make publish-check PUBLISH_PACKAGES="whitaker-common whitaker-installer"

      - name: Record sccache effectiveness
        if: always()
        run: |
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          {
            printf '### sccache\n\n```text\n'
            cat sccache-stats.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-linux-full
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

  windows-compat:
    runs-on: windows-latest
    env:
      NEXTEST_TEST_THREADS: 4
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@32c8ea649ea44d40119f348ad48861212532061f

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Reset sccache statistics
        run: sccache --zero-stats

      - name: Test
        run: make test NEXTEST_PROFILE=ci

      - name: Installer smoke test
        run: make install-smoke

      - name: Installer release dry run
        run: make release-installer-dry-run

      - name: Record sccache effectiveness
        if: ${{ always() }}
        run: |
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          {
            printf '### sccache\n\n```text\n'
            cat sccache-stats.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-windows-compat
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

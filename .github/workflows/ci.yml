name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A second push to a pull request supersedes the run already in flight, which
# otherwise charges a full set of minutes for a result nobody reads. The guard
# is on the event rather than a literal `true`: a manual dispatch shares the
# group and must run to completion, and so must any push trigger added later.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILD_PROFILE: debug
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # One named constant for the Ubicloud Linux shape. Every Linux job derives
  # its Cargo build parallelism and nextest thread count from this value, so
  # changing the label cannot leave the suite oversubscribed on a smaller VM.
  LINUX_RUNNER_VCPUS: '2'
  # Compiler-cache backend selector for the Linux lanes. `gha` routes sccache
  # at the Actions cache service, which on an Ubicloud runner is Ubicloud's own
  # proxy on the private network; `local` routes it at a directory some cache
  # step must own. Flipping this one line switches every Linux lane in this
  # workflow.
  #
  # `gha` is deployed. An earlier attempt at it was reverted because it stored
  # nothing: runs 33748602187 and 33756048103 each reported `Cache location
  # ghac`, 0 read errors, and a write error for every single store attempt,
  # 3,788 of 3,788 and 2,245 of 2,245, and the conclusion drawn at the time was
  # that Ubicloud's proxy had a broken write path. That conclusion was wrong.
  # Neither run exported the proxy's credentials, so sccache never reached the
  # proxy at all. `mozilla-actions/sccache-action` finishes by writing
  # `ACTIONS_CACHE_SERVICE_V2=on` to `GITHUB_ENV`; sccache then prefers
  # GitHub's v2 results service, whose address resolves past the proxy, and
  # every store fails there. One write error per store attempt is that
  # defect's signature.
  #
  # "Export the Ubicloud cache credentials" publishes the proxy address and
  # clears the v2 flag, and the pinned `setup-rust` records those values before
  # the sccache steps run and restores them afterwards, so the clobber cannot
  # recur. netsuke's lane measures 99.6% hits with `Cache location ghac` on the
  # same runner class, and shared-actions' `test-ubicloud-sccache-proxy`
  # workflow compiles on a billed `ubicloud-standard-2` and asserts the bound
  # endpoint is the private proxy.
  SCCACHE_BACKEND: gha
  # `make check-fmt` runs `mdtablefix --check --git`. Keep CI on the same
  # release used to normalize the checked-in documentation; 0.6.0 is the
  # first release with `--check` and `--git`. Markdown linting runs through
  # the pinned markdownlint-cli2 action rather than a shell install.
  MDTABLEFIX_VERSION: '0.6.0'
  MDTABLEFIX_LINUX_X64_SHA256: b78b2ac9b396b71073ff0485d9d37717cdcd82893b660b7146ba6d3f70d43ba0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
# CodeScene coverage: `coverage-main.yml` owns it entirely. It uploads
# main-branch coverage on push, and it is the only workflow here that may
# hold the CodeScene credential. The pull-request lane below still runs the
# suite under instrumentation, because `make coverage` is how this repository
# runs its tests, but it neither contacts CodeScene nor carries that
# credential: a lane a pull request can start is the wrong place for one, and
# an outage there reddened pull requests that had touched nothing.
#
# The credential's name is deliberately absent from this file. The contract
# in `tests/workflow_contracts/coverage_boundary_test.py` reads the raw text
# as well as the parsed values, so a mention in a comment counts: a workflow
# that names it is a workflow somebody is about to wire it into.
#
# Runner policy: Linux developer-blocking jobs run on Ubicloud; Windows stays
# GitHub-hosted because Ubicloud offers Linux images only. Cache policy: every
# restored path has exactly one owner within its job, every save is restricted
# to the trusted branch, and `coverage-main.yml` owns the coverage-lane keys.
jobs:
  coverage-check:
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bound concurrency to the runner shape
        run: |
          {
            printf 'CARGO_BUILD_JOBS=%s\n' "${LINUX_RUNNER_VCPUS}"
            printf 'NEXTEST_TEST_THREADS=%s\n' "${LINUX_RUNNER_VCPUS}"
          } >> "$GITHUB_ENV"

      - name: Export the Ubicloud cache credentials
        # The runner hands `ACTIONS_CACHE_URL` and `ACTIONS_RUNTIME_TOKEN` to
        # action steps, and this republishes them through `GITHUB_ENV` with the
        # v2 cache-service flag cleared, because Ubicloud's proxy serves v1. An
        # sccache server started without them binds local disk for the whole
        # job and reports a plausible hit rate for a store nothing archives.
        # It must precede the selector and every later step, because sccache
        # binds its backend once, when its server starts.
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@dbe2e22ceaf498d85512679ccded38be9dbe7777

      - name: Select the compiler cache backend
        run: bash scripts/select-sccache-backend.sh

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Restore the Rust toolchain and installed tools
        id: rust-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
          key: tools-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-ubuntu2404-nextest0.9.114-llvmcov0.6.24-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the Clippy source mirror
        id: clippy-mirror-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-mirrors
          key: clippy-mirror-v1-dylint6.0.1-${{ hashFiles('rust-toolchain.toml') }}

      - name: Record cache observations
        if: always()
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_MATCHED: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
          RUST_TOOLS_KEY: ${{ steps.rust-tools.outputs.cache-primary-key }}
          RUST_TOOLS_MATCHED: ${{ steps.rust-tools.outputs.cache-matched-key }}
          RUST_TOOLS_HIT: ${{ steps.rust-tools.outputs.cache-hit }}
          CLIPPY_MIRROR_KEY: ${{ steps.clippy-mirror-cache.outputs.cache-primary-key }}
          CLIPPY_MIRROR_MATCHED: ${{ steps.clippy-mirror-cache.outputs.cache-matched-key }}
          CLIPPY_MIRROR_HIT: ${{ steps.clippy-mirror-cache.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Provision the Clippy source mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/provision-clippy-mirror.sh \
            "$HOME/.cache/whitaker-mirrors/rust-clippy.git"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7cb894fe62c40951cccf33819548095e64a1291e
        with:
          cache-provider: external

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: cargo-llvm-cov@0.6.24
          fallback: none

      - name: Generate coverage
        run: make coverage

      - name: Discard the instrumented target tree
        # `cargo llvm-cov` has already written lcov.info, and no job caches a
        # target tree, so this is the largest piece of pure scratch on the
        # disk. This lane saves nothing, but it frees the doctest build the
        # same headroom the writer lane needs for its cache archives.
        if: always()
        run: rm -rf target/llvm-cov-target

      - name: Run doctests
        # `cargo llvm-cov nextest` executes no doctests and `--all-targets`
        # excludes them, so this is the only step in the repository that runs
        # them. It is the second half of one executed set, not a second lane.
        run: make test-doc

      - name: Record sccache effectiveness
        if: always()
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-coverage-check
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      - name: Check sccache health
        # The statistics are uploaded first, so the evidence survives a
        # failure here. Fails on a broken integration (wrong backend, nothing
        # wrapped, every store or read failing); isolated errors only warn.
        run: python3 scripts/check_sccache_health.py --expect-location ghac sccache-stats.json

  linux-full:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Bound concurrency to the runner shape
        run: |
          {
            printf 'CARGO_BUILD_JOBS=%s\n' "${LINUX_RUNNER_VCPUS}"
            printf 'NEXTEST_TEST_THREADS=%s\n' "${LINUX_RUNNER_VCPUS}"
          } >> "$GITHUB_ENV"

      - name: Export the Ubicloud cache credentials
        # The runner hands `ACTIONS_CACHE_URL` and `ACTIONS_RUNTIME_TOKEN` to
        # action steps, and this republishes them through `GITHUB_ENV` with the
        # v2 cache-service flag cleared, because Ubicloud's proxy serves v1. An
        # sccache server started without them binds local disk for the whole
        # job and reports a plausible hit rate for a store nothing archives.
        # It must precede the selector and every later step, because sccache
        # binds its backend once, when its server starts.
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@dbe2e22ceaf498d85512679ccded38be9dbe7777

      - name: Select the compiler cache backend
        run: bash scripts/select-sccache-backend.sh

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Restore the Rust toolchain and installed tools
        id: rust-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            ~/.bun/install/cache
            ~/.cache/merman
          key: tools-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-ubuntu2404-nextest0.9.114-msrv1.85.0-mdtablefix${{ env.MDTABLEFIX_VERSION }}-bun1.2.21-mmdc11.9.0-uv0.11.19-nixie1.1.0-merman0.7.0-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the Dylint host tools
        id: dylint-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-dylint-tools
          key: dylint-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-ubuntu2404-cargo-dylint6.0.1-dylint-link6.0.1

      - name: Restore the Clippy source mirror
        id: clippy-mirror-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-mirrors
          key: clippy-mirror-v1-dylint6.0.1-${{ hashFiles('rust-toolchain.toml') }}

      - name: Record cache observations
        if: always()
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_MATCHED: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
          RUST_TOOLS_KEY: ${{ steps.rust-tools.outputs.cache-primary-key }}
          RUST_TOOLS_MATCHED: ${{ steps.rust-tools.outputs.cache-matched-key }}
          RUST_TOOLS_HIT: ${{ steps.rust-tools.outputs.cache-hit }}
          DYLINT_TOOLS_KEY: ${{ steps.dylint-tools.outputs.cache-primary-key }}
          DYLINT_TOOLS_MATCHED: ${{ steps.dylint-tools.outputs.cache-matched-key }}
          DYLINT_TOOLS_HIT: ${{ steps.dylint-tools.outputs.cache-hit }}
          CLIPPY_MIRROR_KEY: ${{ steps.clippy-mirror-cache.outputs.cache-primary-key }}
          CLIPPY_MIRROR_MATCHED: ${{ steps.clippy-mirror-cache.outputs.cache-matched-key }}
          CLIPPY_MIRROR_HIT: ${{ steps.clippy-mirror-cache.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Provision the Clippy source mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/provision-clippy-mirror.sh \
            "$HOME/.cache/whitaker-mirrors/rust-clippy.git"

      - name: Check Verus FragmentId bridge
        run: scripts/check-verus-fragment-id-bridge.sh

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7cb894fe62c40951cccf33819548095e64a1291e
        with:
          cache-provider: external

      - name: Setup Rust for installer MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: '1.85.0'

      - name: Installer MSRV check
        run: make installer-msrv-check

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'

      - name: Install mdtablefix
        # `make check-fmt` needs the exact release that defines the repository's
        # canonical Markdown output, even when the cache restores an older binary.
        run: |
          expected_mdtablefix_version="mdtablefix ${MDTABLEFIX_VERSION}"
          installed_mdtablefix_version=""
          if command -v mdtablefix >/dev/null 2>&1; then
            installed_mdtablefix_version="$(mdtablefix --version 2>/dev/null | tr -d '\r')"
          fi
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            download="${RUNNER_TEMP}/mdtablefix-linux-x86_64"
            destination="${HOME}/.cargo/bin/mdtablefix"
            url="https://github.com/leynos/mdtablefix/releases/download/v${MDTABLEFIX_VERSION}/mdtablefix-linux-x86_64"
            curl --fail --location --proto '=https' --tlsv1.2 "${url}" -o "${download}"
            echo "${MDTABLEFIX_LINUX_X64_SHA256}  ${download}" \
              | sha256sum --check --status
            mkdir -p "$(dirname "${destination}")"
            install -m 0755 "${download}" "${destination}.new"
            mv "${destination}.new" "${destination}"
          fi
          installed_mdtablefix_version="$(mdtablefix --version | tr -d '\r')"
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            echo "expected ${expected_mdtablefix_version}, got ${installed_mdtablefix_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: make check-fmt

      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: '0.11.19'

      - name: GLIBC baseline checker
        run: make test-glibc-baseline

      - name: sccache health checker
        run: make test-sccache-health

      - name: Install Nixie
        uses: leynos/shared-actions/.github/actions/install-nixie@7cb894fe62c40951cccf33819548095e64a1291e
        with:
          nixie-version: '1.1.0'
          merman-version: '0.7.0'
          python-version: '3.14'

      - name: Enforce en-GB-oxendict spelling
        run: make spelling

      - name: Nixie
        run: make nixie

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Lint
        run: make lint

      - name: Workflow contract tests
        run: make test-workflow-contracts

      - name: Publish dry run
        run: make publish-check PUBLISH_PACKAGES="whitaker-common whitaker-installer"

      - name: Discard the build target tree
        # The last consumer of `target` has run. No job caches a target tree,
        # so removing it here gives the saves below the headroom they need to
        # stage their archives.
        if: always()
        run: rm -rf target

      - name: Record sccache effectiveness
        if: always()
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-linux-full
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      - name: Check sccache health
        # The statistics are uploaded first, so the evidence survives a
        # failure here. Fails on a broken integration (wrong backend, nothing
        # wrapped, every store or read failing); isolated errors only warn.
        run: python3 scripts/check_sccache_health.py --expect-location ghac sccache-stats.json

      - name: Record disk headroom before the saves
        if: always()
        run: bash scripts/record-cache-observations.sh headroom

      # Saves are restricted to the trusted branch, so a pull request reads the
      # published generation without racing another lane for the same key. This
      # workflow has no push trigger, so the lint lane's writer is a
      # `workflow_dispatch` run on `main`; see the developers' guide.
      - name: Save Cargo registry
        if: github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

      - name: Save the Rust toolchain and installed tools
        if: github.ref == 'refs/heads/main' && steps.rust-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            ~/.bun/install/cache
            ~/.cache/merman
          key: ${{ steps.rust-tools.outputs.cache-primary-key }}

      - name: Save the Dylint host tools
        if: github.ref == 'refs/heads/main' && steps.dylint-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-dylint-tools
          key: ${{ steps.dylint-tools.outputs.cache-primary-key }}

  windows-compat:
    runs-on: windows-latest
    env:
      # `windows-latest` is a 4 vCPU GitHub-hosted shape, so it does not share
      # the Ubicloud constant used by the Linux lanes.
      NEXTEST_TEST_THREADS: 4
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-registry-windows-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-nextest0.9.114-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-windows-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Record cache observations
        if: always()
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_MATCHED: ${{ steps.cargo-registry.outputs.cache-matched-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Setup Rust
        # `cache-provider: external` stops the shared action archiving
        # `target/${BUILD_PROFILE}`. No job in this repository caches a
        # `target` tree; sccache owns compiler output for every build shape.
        # This lane keeps the shared action's sccache setup, which installs
        # the binary and exports the Actions cache credentials that a
        # GitHub-hosted `run:` step can already see anyway.
        uses: leynos/shared-actions/.github/actions/setup-rust@7cb894fe62c40951cccf33819548095e64a1291e
        with:
          cache-provider: external

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Reset sccache statistics
        run: sccache --zero-stats

      - name: Test
        run: make test NEXTEST_PROFILE=ci

      - name: Installer smoke test
        run: make install-smoke

      - name: Installer release dry run
        run: make release-installer-dry-run

      - name: Discard the build target tree
        # The last consumer of `target` has run. This lane saves a smaller
        # archive onto a larger disk than the Ubicloud lanes, but the rule is
        # the same for every saving job rather than one with exceptions.
        if: always()
        run: rm -rf target

      - name: Record sccache effectiveness
        if: ${{ always() }}
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-windows-compat
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      - name: Record disk headroom before the saves
        if: always()
        run: bash scripts/record-cache-observations.sh headroom

      # Windows archives land in GitHub's cache rather than Ubicloud's, so the
      # key carries `runner.os` and `runner.arch` and this lane is the only
      # writer for it.
      - name: Save Cargo registry
        if: github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

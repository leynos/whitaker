name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PROFILE: debug
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # One named constant for the Ubicloud Linux shape. Every Linux job derives
  # its Cargo build parallelism and nextest thread count from this value, so
  # changing the label cannot leave the suite oversubscribed on a smaller VM.
  LINUX_RUNNER_VCPUS: '2'
  # Compiler-cache backend selector for the Linux lanes. `gha` routes sccache
  # at the Actions cache service; `local` routes it at the directory owned by
  # the "Restore the compiler cache directory" steps. Flipping this one line
  # switches every Linux lane.
  #
  # `local` is deployed because `gha` stores nothing on Whitaker's Ubicloud
  # runners. Runs 33748602187 and 33756048103 each reported `Cache location
  # ghac`, 0 read errors, and a write error for every single store attempt,
  # 3,788 of 3,788 and 2,245 of 2,245. The GitHub-hosted Windows lane in the
  # same run wrote through `ghac` with 0 write errors, so the failure is
  # specific to the Ubicloud cache proxy's write path, not to the backend.
  SCCACHE_BACKEND: local
  # `make check-fmt` shells out to both Markdown formatters. Keep CI on the
  # same releases used to normalize the checked-in documentation.
  MDTABLEFIX_VERSION: '0.5.0'
  MDTABLEFIX_LINUX_X64_SHA256: bd38cd30f0405120c453b3e80b0d4e78a34d93d2c2121a0fd4ace4a54bacaeeb
  MARKDOWNLINT_CLI2_VERSION: '0.20.0'
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  RUSTC_WRAPPER: sccache
# CodeScene coverage: main-branch coverage is uploaded by
# coverage-main.yml on push. The pull-request changed-line gate runs in
# the coverage-check job below via `mode: check` against the same
# `make coverage` lcov.info that coverage-main.yml generates.
#
# Runner policy: Linux developer-blocking jobs run on Ubicloud; Windows stays
# GitHub-hosted because Ubicloud offers Linux images only. Cache policy: every
# restored path has exactly one owner within its job, every save is restricted
# to the trusted branch, and `coverage-main.yml` owns the coverage-lane keys.
jobs:
  coverage-check:
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Expose the Actions cache credentials to sccache
        # Must precede anything that starts the sccache server. A `run:` step
        # on Ubicloud cannot see these variables, so a server started before
        # this step comes up in local-disk mode and stays there for the whole
        # job, reporting zero requests. GitHub-hosted lanes need no export.
        if: env.SCCACHE_BACKEND == 'gha'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN ?? '');
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name];
              if (value) { core.exportVariable(name, value); }
            }

      - name: Bound concurrency to the runner shape
        run: |
          {
            printf 'CARGO_BUILD_JOBS=%s\n' "${LINUX_RUNNER_VCPUS}"
            printf 'NEXTEST_TEST_THREADS=%s\n' "${LINUX_RUNNER_VCPUS}"
          } >> "$GITHUB_ENV"

      - name: Select the compiler cache backend
        run: bash scripts/select-sccache-backend.sh

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Restore the Rust toolchain and installed tools
        id: rust-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
          key: tools-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-ubuntu2404-sccache0.16.0-nextest0.9.114-llvmcov0.6.24-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the Clippy source mirror
        id: clippy-mirror-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-mirrors
          key: clippy-mirror-v1-dylint6.0.1-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the compiler cache directory
        id: sccache-dir
        if: env.SCCACHE_BACKEND == 'local'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/sccache
          key: sccache-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Record cache observations
        if: always()
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
          RUST_TOOLS_KEY: ${{ steps.rust-tools.outputs.cache-primary-key }}
          RUST_TOOLS_HIT: ${{ steps.rust-tools.outputs.cache-hit }}
          CLIPPY_MIRROR_KEY: ${{ steps.clippy-mirror-cache.outputs.cache-primary-key }}
          CLIPPY_MIRROR_HIT: ${{ steps.clippy-mirror-cache.outputs.cache-hit }}
          SCCACHE_DIR_KEY: ${{ steps.sccache-dir.outputs.cache-primary-key }}
          SCCACHE_DIR_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Provision the Clippy source mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/provision-clippy-mirror.sh \
            "$HOME/.cache/whitaker-mirrors/rust-clippy.git"

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@5daae0a332441d170d88ca648c9e71f0bbe96cb3
        with:
          cache-provider: external
          use-sccache: false

      - name: Install sccache
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: sccache@0.16.0
          fallback: none

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: cargo-llvm-cov@0.6.24
          fallback: none

      - name: Reset sccache statistics
        run: sccache --zero-stats

      - name: Generate coverage
        run: make coverage

      - name: Record sccache effectiveness
        if: always()
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-coverage-check
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'pull_request' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@32c8ea649ea44d40119f348ad48861212532061f
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/71836
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  linux-full:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Expose the Actions cache credentials to sccache
        # Must precede anything that starts the sccache server. A `run:` step
        # on Ubicloud cannot see these variables, so a server started before
        # this step comes up in local-disk mode and stays there for the whole
        # job, reporting zero requests. GitHub-hosted lanes need no export.
        if: env.SCCACHE_BACKEND == 'gha'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN ?? '');
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name];
              if (value) { core.exportVariable(name, value); }
            }

      - name: Bound concurrency to the runner shape
        run: |
          {
            printf 'CARGO_BUILD_JOBS=%s\n' "${LINUX_RUNNER_VCPUS}"
            printf 'NEXTEST_TEST_THREADS=%s\n' "${LINUX_RUNNER_VCPUS}"
          } >> "$GITHUB_ENV"

      - name: Select the compiler cache backend
        run: bash scripts/select-sccache-backend.sh

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Restore the Rust toolchain and installed tools
        id: rust-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            ~/.bun/install/cache
            ~/.cache/merman
          key: tools-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-ubuntu2404-sccache0.16.0-nextest0.9.114-msrv1.85.0-mdtablefix${{ env.MDTABLEFIX_VERSION }}-mdlint${{ env.MARKDOWNLINT_CLI2_VERSION }}-bun1.2.21-mmdc11.9.0-uv0.11.19-nixie1.1.0-merman0.7.0-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the Dylint host tools
        id: dylint-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-dylint-tools
          key: dylint-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-ubuntu2404-cargo-dylint6.0.1-dylint-link6.0.1

      - name: Restore the Clippy source mirror
        id: clippy-mirror-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-mirrors
          key: clippy-mirror-v1-dylint6.0.1-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the compiler cache directory
        id: sccache-dir
        if: env.SCCACHE_BACKEND == 'local'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/sccache
          key: sccache-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-lint-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Record cache observations
        if: always()
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
          RUST_TOOLS_KEY: ${{ steps.rust-tools.outputs.cache-primary-key }}
          RUST_TOOLS_HIT: ${{ steps.rust-tools.outputs.cache-hit }}
          DYLINT_TOOLS_KEY: ${{ steps.dylint-tools.outputs.cache-primary-key }}
          DYLINT_TOOLS_HIT: ${{ steps.dylint-tools.outputs.cache-hit }}
          CLIPPY_MIRROR_KEY: ${{ steps.clippy-mirror-cache.outputs.cache-primary-key }}
          CLIPPY_MIRROR_HIT: ${{ steps.clippy-mirror-cache.outputs.cache-hit }}
          SCCACHE_DIR_KEY: ${{ steps.sccache-dir.outputs.cache-primary-key }}
          SCCACHE_DIR_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Provision the Clippy source mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/provision-clippy-mirror.sh \
            "$HOME/.cache/whitaker-mirrors/rust-clippy.git"

      - name: Check Verus FragmentId bridge
        run: scripts/check-verus-fragment-id-bridge.sh

      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@5daae0a332441d170d88ca648c9e71f0bbe96cb3
        with:
          cache-provider: external
          use-sccache: false

      - name: Install sccache
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: sccache@0.16.0
          fallback: none

      - name: Reset sccache statistics
        run: sccache --zero-stats

      - name: Setup Rust for installer MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: '1.85.0'

      - name: Installer MSRV check
        run: make installer-msrv-check

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'

      - name: Install mdtablefix
        # `make check-fmt` needs the exact release that defines the repository's
        # canonical Markdown output, even when the cache restores an older binary.
        run: |
          expected_mdtablefix_version="mdtablefix ${MDTABLEFIX_VERSION}"
          installed_mdtablefix_version=""
          if command -v mdtablefix >/dev/null 2>&1; then
            installed_mdtablefix_version="$(mdtablefix --version 2>/dev/null | tr -d '\r')"
          fi
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            download="${RUNNER_TEMP}/mdtablefix-linux-x86_64"
            destination="${HOME}/.cargo/bin/mdtablefix"
            url="https://github.com/leynos/mdtablefix/releases/download/v${MDTABLEFIX_VERSION}/mdtablefix-linux-x86_64"
            curl --fail --location --proto '=https' --tlsv1.2 "${url}" -o "${download}"
            echo "${MDTABLEFIX_LINUX_X64_SHA256}  ${download}" \
              | sha256sum --check --status
            mkdir -p "$(dirname "${destination}")"
            install -m 0755 "${download}" "${destination}.new"
            mv "${destination}.new" "${destination}"
          fi
          installed_mdtablefix_version="$(mdtablefix --version | tr -d '\r')"
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            echo "expected ${expected_mdtablefix_version}, got ${installed_mdtablefix_version}" >&2
            exit 1
          fi

      - name: Install Markdown lint CLI
        # Match the lint-fixing pass that `make fmt` and `make check-fmt` share.
        run: |
          bun install --no-progress --global "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          markdownlint_version_output="$(markdownlint-cli2 --version)"
          installed_markdownlint_version="${markdownlint_version_output%%$'\n'*}"
          expected_markdownlint_version="markdownlint-cli2 v${MARKDOWNLINT_CLI2_VERSION}"
          if [[ "${installed_markdownlint_version}" != "${expected_markdownlint_version}"* ]]; then
            echo "expected ${expected_markdownlint_version}, got ${installed_markdownlint_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: make check-fmt

      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: '0.11.19'

      - name: GLIBC baseline checker
        run: make test-glibc-baseline

      - name: Install Nixie
        uses: leynos/shared-actions/.github/actions/install-nixie@bffacaf91d3f3515110679a30fbf6dc781ddc549
        with:
          nixie-version: '1.1.0'
          merman-version: '0.7.0'
          python-version: '3.14'

      - name: Enforce en-GB-oxendict spelling
        run: make spelling

      - name: Nixie
        run: make nixie

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md
            !**/.uv-cache/**
            !**/.uv-tools/**

      - name: Lint
        run: make lint

      - name: Workflow contract tests
        run: make test-workflow-contracts

      - name: Publish dry run
        run: make publish-check PUBLISH_PACKAGES="whitaker-common whitaker-installer"

      - name: Record sccache effectiveness
        if: always()
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-linux-full
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      # Saves are restricted to the trusted branch, so a pull request reads the
      # published generation without racing another lane for the same key. This
      # workflow has no push trigger, so the lint lane's writer is a
      # `workflow_dispatch` run on `main`; see the developers' guide.
      - name: Save Cargo registry
        if: github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

      - name: Save the Rust toolchain and installed tools
        if: github.ref == 'refs/heads/main' && steps.rust-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            ~/.bun/install/cache
            ~/.cache/merman
          key: ${{ steps.rust-tools.outputs.cache-primary-key }}

      - name: Save the Dylint host tools
        if: github.ref == 'refs/heads/main' && steps.dylint-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/whitaker-dylint-tools
          key: ${{ steps.dylint-tools.outputs.cache-primary-key }}

      - name: Save the compiler cache directory
        if: env.SCCACHE_BACKEND == 'local' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ steps.sccache-dir.outputs.cache-primary-key }}

  windows-compat:
    runs-on: windows-latest
    env:
      # `windows-latest` is a 4 vCPU GitHub-hosted shape, so it does not share
      # the Ubicloud constant used by the Linux lanes.
      NEXTEST_TEST_THREADS: 4
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-registry-windows-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-nextest0.9.114-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-windows-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Record cache observations
        if: always()
        env:
          CARGO_REGISTRY_KEY: ${{ steps.cargo-registry.outputs.cache-primary-key }}
          CARGO_REGISTRY_HIT: ${{ steps.cargo-registry.outputs.cache-hit }}
        run: bash scripts/record-cache-observations.sh

      - name: Setup Rust
        # `cache-provider: external` stops the shared action archiving
        # `target/${BUILD_PROFILE}`. No job in this repository caches a
        # `target` tree; sccache owns compiler output for every build shape.
        # This lane keeps the shared action's sccache setup, which installs
        # the binary and exports the Actions cache credentials that a
        # GitHub-hosted `run:` step can already see anyway.
        uses: leynos/shared-actions/.github/actions/setup-rust@5daae0a332441d170d88ca648c9e71f0bbe96cb3
        with:
          cache-provider: external

      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.114
          fallback: none

      - name: Reset sccache statistics
        run: sccache --zero-stats

      - name: Test
        run: make test NEXTEST_PROFILE=ci

      - name: Installer smoke test
        run: make install-smoke

      - name: Installer release dry run
        run: make release-installer-dry-run

      - name: Record sccache effectiveness
        if: ${{ always() }}
        run: bash scripts/record-sccache-effectiveness.sh

      - name: Upload sccache statistics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sccache-stats-windows-compat
          path: sccache-stats.json
          if-no-files-found: error
          retention-days: 14

      # Windows archives land in GitHub's cache rather than Ubicloud's, so the
      # key carries `runner.os` and `runner.arch` and this lane is the only
      # writer for it.
      - name: Save Cargo registry
        if: github.ref == 'refs/heads/main' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

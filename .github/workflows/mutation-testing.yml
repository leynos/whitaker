name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
# Scheduled runs mutate only files changed within the detection window;
# manual dispatch runs mutate everything, fanned out across shards. To
# test a branch, select it in the Actions "Run workflow" control.

on:
  schedule:
    - cron: "50 4 * * *" # Daily, 04:50 UTC
  workflow_dispatch:

# Default the token to no scopes; the job opts in explicitly.
permissions: {}

# Serialize runs per ref: a dispatch during a scheduled run (or vice
# versa) queues rather than racing. Runs are informational, so queued
# runs wait instead of cancelling.
concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@ff1dd759dfffc0db3459e30e833f52437ee62b57
    with:
      # Workspace members live under cli/, common/, crates/, installer/,
      # and suite/ alongside the root crate's src/; there are no
      # repo-root examples/ or benches/ directories.
      paths: "src/,cli/,common/,crates/,installer/,suite/"
      # Scaffolding whose survivors are noise: the rustc_* proxy shims
      # and the clippy_utils stub re-export compiler internals; the
      # per-lint ui/ and examples/ directories hold dylint UI fixtures;
      # crates/whitaker_lint_core/src/testing and
      # common/src/test_support are shared test infrastructure; and
      # vendor/dylint_testing is a vendored upstream fork that
      # --workspace reaches.
      #
      # Source compiled only when a non-default feature or cfg is active
      # is excluded too. cargo-mutants enumerates module files without
      # evaluating their cfg, while the baseline builds each package with
      # default features. Mutating such a module would report survivors for
      # code the tests never compiled. That covers the lint crates' driver,
      # config, diagnostics, context, and helper modules gated on
      # dylint-driver, the Kani harnesses under cfg(kani), and the
      # Windows-only installer test module.
      exclude-globs: >-
        crates/rustc_*/**,
        crates/clippy_utils/**,
        crates/*/ui/**,
        crates/*/examples/**,
        crates/whitaker_lint_core/src/testing/**,
        common/src/test_support/**,
        vendor/dylint_testing/**,
        crates/bumpy_road_function/src/driver/**,
        crates/conditional_max_n_branches/src/driver/**,
        crates/conditional_max_n_branches/src/tests/**,
        crates/function_attrs_follow_docs/src/driver*,
        crates/function_attrs_follow_docs/src/tests/**,
        crates/macro_aware_cognitive_complexity/src/driver/**,
        crates/module_max_lines/src/driver.rs,
        crates/module_max_lines/src/lib_ui_tests.rs,
        crates/module_must_have_inner_docs/src/driver/**,
        crates/module_must_have_inner_docs/src/tests/**,
        crates/no_expect_outside_tests/src/behaviour.rs,
        crates/no_expect_outside_tests/src/context/**,
        crates/no_expect_outside_tests/src/dependency_rlib_tests.rs,
        crates/no_expect_outside_tests/src/diagnostics.rs,
        crates/no_expect_outside_tests/src/driver/**,
        crates/no_expect_outside_tests/src/lib_ui_tests.rs,
        crates/no_expect_outside_tests/src/tests.rs,
        crates/no_expect_outside_tests/src/tests/**,
        crates/no_std_fs_operations/src/behaviour.rs,
        crates/no_std_fs_operations/src/config*,
        crates/no_std_fs_operations/src/diagnostics*,
        crates/no_std_fs_operations/src/driver.rs,
        crates/no_std_fs_operations/src/exclusion*,
        crates/no_std_fs_operations/src/tests*,
        crates/no_std_fs_operations/src/usage/**,
        crates/no_unwrap_or_else_panic/src/context/**,
        crates/no_unwrap_or_else_panic/src/diagnostics.rs,
        crates/no_unwrap_or_else_panic/src/driver.rs,
        crates/no_unwrap_or_else_panic/src/lib_ui_tests.rs,
        crates/no_unwrap_or_else_panic/src/panic_detector.rs,
        crates/no_unwrap_or_else_panic/src/policy.rs,
        crates/no_unwrap_or_else_panic/src/tests*,
        crates/rstest_helper_should_be_fixture/src/collector*,
        crates/rstest_helper_should_be_fixture/src/driver*,
        crates/rstest_helper_should_be_fixture/src/visitor.rs,
        crates/string_continuation_style/src/config.rs,
        crates/string_continuation_style/src/diagnostics.rs,
        crates/string_continuation_style/src/driver/**,
        crates/string_continuation_style/src/exclusion.rs,
        crates/test_must_not_have_example/src/behaviour.rs,
        crates/test_must_not_have_example/src/driver.rs,
        crates/test_must_not_have_example/src/heuristics.rs,
        crates/test_must_not_have_example/src/lib_ui_tests.rs,
        crates/whitaker_lint_core/src/hir/**,
        suite/src/driver.rs,
        common/src/decomposition_advice/community/../community_kani/**,
        crates/whitaker_clones_core/src/**/kani.rs,
        crates/whitaker_string_literals/src/**/kani.rs,
        installer/src/deps/path_windows_tests.rs,
        src/cli/check/flow/samplers.rs,
        src/cli/check/flow/script.rs,
        src/cli/check/flow/verification.rs,
        src/cli/check/flow/witnesses.rs
      # Mutate under the packages' default features. `--all-features` enabled
      # `dylint-driver` across the workspace, Cargo unified it into the lint
      # crates' integration-test binaries, and those binaries cannot link the
      # compiler's `rustc_private` libraries: every shard failed its baseline
      # with 19 "only shows up once" errors before testing a mutant (run
      # 33961579896). The root `whitaker` package declares no such feature, so
      # its default set is already the whole of it. The driver configuration
      # is exercised by the per-lint `--features dylint-driver` builds in
      # `make publish-check`, and `make mutation-baseline` runs this package
      # and feature selection on every pull request, so a baseline that stops
      # linking fails there rather than a nightly run. The guard covers both
      # the root package and the lint core whose binaries the original run
      # failed to link.
      #
      # `--workspace` is load-bearing: this workspace has a root package
      # beside its members and sets no `default-members`, so without it
      # cargo-mutants mutates only the root package and a changed file under
      # cli/, common/, crates/, installer/ or suite/ enumerates no mutants at
      # all.
      # Kani-only items in files that also hold production code cannot be
      # excluded by path, so filter them by the mutant name. `_for_kani` and
      # `ForKani` cover the LSH/MinHash proof seams, `verification::` covers
      # the inline exit-code and dispatch harnesses, and the line-bound
      # `minhash` clause covers the unrolled Kani `sketch_values` variant.
      extra-args: >-
        --workspace
        --exclude-re '(_for_kani|ForKani|verification::|minhash\.rs:(1[2-9][0-9]|[2-9][0-9]{2}):)'

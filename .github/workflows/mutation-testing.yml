name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
# Scheduled runs mutate only files changed within the detection window;
# manual dispatch runs mutate everything, fanned out across shards. To
# test a branch, select it in the Actions "Run workflow" control.

on:
  schedule:
    - cron: "50 4 * * *" # Daily, 04:50 UTC
  workflow_dispatch:

# Default the token to no scopes; the job opts in explicitly.
permissions: {}

# Serialize runs per ref: a dispatch during a scheduled run (or vice
# versa) queues rather than racing. Runs are informational, so queued
# runs wait instead of cancelling.
concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@ff1dd759dfffc0db3459e30e833f52437ee62b57
    with:
      # Workspace members live under common/, crates/, installer/, and
      # suite/ alongside the root crate's src/; there are no repo-root
      # examples/ or benches/ directories.
      paths: "src/,common/,crates/,installer/,suite/"
      # Scaffolding whose survivors are noise: the rustc_* proxy shims
      # and the clippy_utils stub re-export compiler internals, the
      # per-lint ui/ and examples/ directories hold dylint UI fixtures,
      # and crates/whitaker_lint_core/src/testing plus
      # common/src/test_support are shared test
      # infrastructure.
      exclude-globs: "crates/rustc_*/**,crates/clippy_utils/**,crates/*/ui/**,crates/*/examples/**,crates/whitaker_lint_core/src/testing/**,common/src/test_support/**"
      # Mutate under the packages' default features. `--all-features` enabled
      # `dylint-driver` across the workspace, Cargo unified it into the lint
      # crates' integration-test binaries, and those binaries cannot link the
      # compiler's `rustc_private` libraries: every shard failed its baseline
      # with 19 "only shows up once" errors before testing a mutant (run
      # 33961579896). The root `whitaker` package declares no such feature, so
      # its default set is already the whole of it. The driver configuration
      # is exercised by the per-lint `--features dylint-driver` builds in
      # `make publish-check`, and `make mutation-baseline` runs this package
      # and feature selection on every pull request, so a baseline that stops
      # linking fails there rather than a nightly run.

# ---------------------------------------------------------------------------
# Default profile — skip slow installer tests for fast local iteration.
# Run `make test NEXTEST_PROFILE=ci` (or set the env var) to include them.
# CI always uses the ci profile.
# ---------------------------------------------------------------------------
[profile.default]
# Dylint fixture examples are executed by their UI harnesses. `--all-targets`
# would otherwise make Nextest discover and spawn them redundantly, racing the
# harnesses that rebuild the same binaries.
default-filter = "not (binary(behaviour_toolchain) | binary(behaviour_cli) | kind(example))"

# CI profile — run the full suite including slow installer tests.
[profile.ci]
default-filter = "not kind(example)"

# Serialize dylint UI tests that build lint libraries and use
# `#[serial]`.  nextest runs each test in its own process, so the
# `serial_test` crate's in-process mutex has no effect.  A test-group
# with max-threads = 1 prevents concurrent lint-library builds from
# racing on the shared target directory.
[test-groups]
serial-dylint-ui = { max-threads = 1 }
serial-rstest-helper-examples = { max-threads = 1 }
serial-toolchain-installs = { max-threads = 1 }

[[profile.default.overrides]]
# Include crate-local UI entrypoints that wrap dylint UI fixtures.
# On Windows, `dylint::driver_builder::get` persists a temporary file via
# `tempfile::NamedTempFile::persist()`.  Windows Defender or indexing services
# can briefly hold a handle on the file, causing the rename to fail with
# "Access is denied (os error 5)".  Retrying with back-off is the standard
# mitigation for this class of transient failure.
#
# The final clause `(binary(ui) & test(=ui))` catches crates whose test
# integration binary is `tests/ui.rs` with a top-level `fn ui()` — the test
# name reported to nextest is plain `ui`, not `ui::ui`, so the substring
# match `test(ui::ui)` does not capture them (e.g. bumpy_road_function).
#
# `ui::example_compiles_under_test_harness`,
# `ui::rstest_unwrap_outside_tests_still_fails_in_non_harness_code`, and
# `ui::rstest_empty_companion_does_not_exempt_parent_function` are gated on
# `#[cfg(not(windows))]` in `no_unwrap_or_else_panic`; on Windows these filter
# clauses match nothing.  The `rstest-bdd-macros` dev-dependency proc-macro
# hangs during cargo's dev-dependency resolution on Windows CI regardless of
# whether any example source uses rstest, so all Dylint example compilation for
# that crate is compiled away on Windows.
filter = "test(driver::ui::) | test(tests::ui::) | test(ui::ui) | test(ui::example_compiles_under_test_harness) | test(ui::rstest_unwrap_outside_tests_still_fails_in_non_harness_code) | test(ui::rstest_empty_companion_does_not_exempt_parent_function) | (binary(ui) & test(=ui))"
test-group = "serial-dylint-ui"
retries = { backoff = "exponential", count = 2, delay = "5s" }
# Each UI run compiles the lint library and its fixtures, so its wall-clock
# time includes any wait for a compiler slot or the Cargo package cache on a
# shared host. Those waits routinely exceed ten minutes, which a single
# ten-minute period misreported as a test timeout. Report slowness every 15
# minutes and keep a finite one-hour watchdog per attempt.
slow-timeout = { period = "15m", terminate-after = 4 }

[[profile.default.overrides]]
# The `rstest_helper_should_be_fixture` example tests share a lock around
# example rebuilds. Running them one at a time keeps each test's wait for its
# turn in nextest's queue, where it consumes neither the lock's acquire
# timeout nor the test's own budget. The trybuild case joins the group because
# it is this binary's heaviest compile.
filter = "package(rstest_helper_should_be_fixture) & binary(ui) & (test(/^example_/) | test(=trybuild_fixtures_compile_without_diagnostics))"
test-group = "serial-rstest-helper-examples"
slow-timeout = { period = "30m", terminate-after = 6 }

[[profile.default.overrides]]
# Example-target harnesses rebuild their example and the lint library before
# running it, so their wall-clock time is dominated by waits for compiler
# slots on a shared host: single cases have measured over 28 minutes, and the
# trybuild case over an hour, under a full gate run. Keep a finite watchdog
# sized to those measurements rather than to execution time.
filter = "(package(rstest_helper_should_be_fixture) & binary(ui)) | ((package(no_unwrap_or_else_panic) | package(no_expect_outside_tests)) & test(/^ui::/))"
slow-timeout = { period = "30m", terminate-after = 6 }

[[profile.default.overrides]]
# Serialize ignored exclusion integration tests when they are explicitly run.
# They build and stage the lint library before invoking `cargo dylint`, so they
# share the same target-directory race risk as the UI harnesses above.
filter = "binary(integration_exclusion)"
test-group = "serial-dylint-ui"

# Extend the timeout for toolchain auto-install behavioural tests, since the
# isolated rustup setup may need to download and install a full nightly toolchain.
[[profile.default.overrides]]
filter = "binary(behaviour_toolchain)"
slow-timeout = { period = "30m", terminate-after = 1 }

# These three scenarios all invoke installer-driven lint builds and can
# contend on shared rustup/cargo state when run in parallel.
[[profile.default.overrides]]
filter = "binary(behaviour_toolchain) & (test(scenario_auto_detect_toolchain_install) | test(scenario_auto_install_success_emits_message) | test(scenario_auto_install_success_quiet_mode))"
test-group = "serial-toolchain-installs"

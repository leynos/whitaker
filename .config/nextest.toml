# ---------------------------------------------------------------------------
# Default profile — skip slow installer tests for fast local iteration.
# Run `make test NEXTEST_PROFILE=ci` (or set the env var) to include them.
# CI always uses the ci profile.
# ---------------------------------------------------------------------------
[profile.default]
# Dylint fixture examples are executed by their UI harnesses. `--all-targets`
# would otherwise make Nextest discover and spawn them redundantly, racing the
# harnesses that rebuild the same binaries.
default-filter = "not (binary(behaviour_toolchain) | binary(behaviour_cli) | kind(example))"
# Nothing else bounds a single test here. The overrides below raise this for
# the harnesses that legitimately need longer; without a base value, a test
# that hangs is reported slow for ever and only the job timer ends it, which
# cancels the run and discards the log that would have named the test.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
# A full run under the 240-minute limit ran 1,846/1,852 tests: 1,845 passed
# (one flaky), and `trybuild_fixtures_compile_without_diagnostics` timed out
# after 75 minutes while nested Cargo waited for compiler slots. Its 120-minute
# allowance below uses the additional 60 minutes for 45 more minutes on that
# build and 15 minutes for the remaining tests.
# See "Test timeouts: four tiers, outermost last" in the developers' guide.
global-timeout = "300m"

# CI profile — run the full suite including slow installer tests.
[profile.ci]
default-filter = "not kind(example)"
# This profile is what the Windows lane runs, and it had no base per-test
# bound: nothing here terminated an ordinary hung test, whichever profile
# ran it. nextest does consult `[[profile.default.overrides]]` when this
# profile is selected, so the toolchain and dylint allowances below were
# already in force; they are restated as this profile's own because this
# is the profile that includes the binaries they exist for, and the
# budgets that govern CI belong where a reader of this profile finds
# them.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "300m"

[[profile.ci.overrides]]
# The toolchain auto-install behavioural tests may download and install a
# full nightly toolchain. Matches the default profile's allowance below.
filter = "binary(behaviour_toolchain)"
slow-timeout = { period = "30m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-toolchain-installs"

[[profile.ci.overrides]]
# Dylint UI harnesses build lint libraries; the default profile gives them
# the same allowance below.
# `whitaker-installer`'s binary is
# named `ui` but its test is not, so the `(binary(ui) & test(=ui))`
# clause does not reach it; it measured 235 s and timed out at 300 s on
# the Windows lane under the base allowance.
#
# Every test in `no_unwrap_or_else_panic`'s `ui` module rebuilds that crate's
# lint library through nested Cargo, so the whole package gets a longer
# allowance in its own override below rather than a share of this one. Those
# harnesses are gated on `#[cfg(not(windows))]`, so on Windows they match
# nothing. The `rstest-bdd-macros` dev-dependency proc-macro hangs during
# cargo's dev-dependency resolution on Windows CI regardless of whether any
# example source uses rstest, so all Dylint example compilation for that crate
# is compiled away on Windows.
#
# This profile carries the same clauses as the default profile's copy, with the
# exclusion wrapped around the whole disjunction for the same reason: a bare
# `test(<name>)` matches that name in every package, so
# `test(ui::example_compiles_under_test_harness)` reaches
# `no_unwrap_or_else_panic` and `rstest_helper_should_be_fixture` too. It also
# reaches `no_expect_outside_tests`, which declares a harness of that name, has
# no override of its own, and previously had *no* build-sized allowance in this
# profile at all.
#
# The lock test is joined outside the guard because, unlike the harnesses, it
# belongs to the excluded package and still needs serializing: it takes the
# target-scoped file lock rather than rebuilding anything, so it needs the group
# but not a longer timeout.
filter = "((test(driver::ui::) | test(tests::ui::) | test(ui::ui) | test(example_harness_collects_call_site_evidence) | test(ui::example_compiles_under_test_harness) | test(ui::rstest_unwrap_outside_tests_still_fails_in_non_harness_code) | test(ui::rstest_empty_companion_does_not_exempt_parent_function) | (binary(ui) & test(=ui))) & not package(no_unwrap_or_else_panic) & not package(rstest_helper_should_be_fixture)) | test(acquire_places_the_lock_inside_the_effective_target_directory)"
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-dylint-ui"
retries = { backoff = "exponential", count = 2, delay = "5s" }

[[profile.ci.overrides]]
# Every `ui` test in this package rebuilds the lint library through nested
# Cargo: the fixtures directory and each example harness both pay for a cold
# build. The 150-minute run reached one of them near the global deadline while
# the package-cache lock was held, so match the whole package's own binary
# rather than naming individual tests. An earlier name-list filter selected
# `ui::ui`, which no test in this crate is called, so every harness fell to the
# 300 s base and two were killed at 300.006 s. Give one build time to finish
# instead of retrying it.
filter = "package(no_unwrap_or_else_panic) & binary(no_unwrap_or_else_panic)"
slow-timeout = { period = "75m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-dylint-ui"
retries = 0

[[profile.ci.overrides]]
# Match the default profile's allowance for this nested library/example build.
filter = "package(rstest_helper_should_be_fixture) & (test(example_compiles_without_diagnostics) | test(example_harness_collects_call_site_evidence))"
slow-timeout = { period = "75m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-dylint-ui"
retries = { backoff = "exponential", count = 2, delay = "5s" }

[[profile.ci.overrides]]
# The other trybuild compile contracts build fixtures through nested Cargo.
# Keep them under one build-sized allowance and avoid retries that repeat work.
filter = "test(sha2_0_11_pre_migration_patterns_fail_to_compile)"
slow-timeout = { period = "75m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-dylint-ui"
retries = 0

[[profile.ci.overrides]]
# This fixture suite had not finished compiling after 75 minutes in a healthy
# but busy compiler queue. Allow one longer build without retrying it.
filter = "package(rstest_helper_should_be_fixture) & test(trybuild_fixtures_compile_without_diagnostics)"
slow-timeout = { period = "120m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-dylint-ui"
retries = 0

[[profile.ci.overrides]]
# The parser-pin fixtures run nested Cargo builds with isolated targets. Their
# longer allowance reflects a full interval spent queued for compiler slots.
filter = "binary(build_script_integration)"
slow-timeout = { period = "75m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-nested-cargo-builds"

[[profile.ci.overrides]]
# This feature-disabled build also uses a fresh target directory; allow it to
# finish after nested Cargo waits for shared compiler admission.
filter = "binary(no_default_features_build)"
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-nested-cargo-builds"

[[profile.ci.overrides]]
# Package-isolated checks can queue for shared cache and compiler resources;
# serialize them with the other nested builds.
filter = "test(crate_builds_without_dylint_driver_feature) | test(fluent_bundles_are_included_in_the_package_tarball)"
slow-timeout = { period = "30m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-nested-cargo-builds"

# Serialize dylint UI tests that build lint libraries and use
# `#[serial]`.  nextest runs each test in its own process, so the
# `serial_test` crate's in-process mutex has no effect.  A test-group
# with max-threads = 1 prevents concurrent lint-library builds from
# racing on the shared target directory.
[test-groups]
serial-dylint-ui = { max-threads = 1 }
serial-toolchain-installs = { max-threads = 1 }
serial-nested-cargo-builds = { max-threads = 1 }

[[profile.default.overrides]]
# Include crate-local UI entrypoints that wrap dylint UI fixtures.
# On Windows, `dylint::driver_builder::get` persists a temporary file via
# `tempfile::NamedTempFile::persist()`.  Windows Defender or indexing services
# can briefly hold a handle on the file, causing the rename to fail with
# "Access is denied (os error 5)".  Retrying with back-off is the standard
# mitigation for this class of transient failure.
#
# The final clause `(binary(ui) & test(=ui))` catches crates whose test
# integration binary is `tests/ui.rs` with a top-level `fn ui()` — the test
# name reported to nextest is plain `ui`, not `ui::ui`, so the substring
# match `test(ui::ui)` does not capture them (e.g. bumpy_road_function).
#
# Two crates keep their own overrides below and are excluded here: a setting
# resolves from the *first* matching override that configures it, so a
# broader clause placed above those would shadow their longer allowance and
# their `retries = 0`.
#
# The exclusion wraps the whole disjunction rather than one clause, because
# *any* disjunct can capture these packages. A bare `test(<name>)` matches that
# name in every package, so `test(example_harness_collects_call_site_evidence)`
# reaches `rstest_helper_should_be_fixture`'s harness, and
# `test(ui::example_compiles_under_test_harness)` reaches
# `no_unwrap_or_else_panic`'s; both were held to this 20-minute allowance
# instead of the 75-minute ones below. Guarding each clause separately fixed
# that symptom but left the next clause free to reintroduce it, and the
# shadowing is invisible to inspection because every clause reads as belonging
# to the crate it was written for.
#
# The clauses cannot simply be deleted instead. `no_expect_outside_tests`
# declares `ui::example_compiles_under_test_harness` too, has no override of
# its own, and needs this clause to be serialized with a build-sized bound.
#
# The lock test is joined outside the guard because, unlike the harnesses, it
# belongs to the excluded package and still needs serializing: it takes the
# target-scoped file lock rather than rebuilding anything, so it needs the group
# but not a longer timeout.
filter = "((test(driver::ui::) | test(tests::ui::) | test(ui::ui) | test(example_harness_collects_call_site_evidence) | test(ui::example_compiles_under_test_harness) | test(ui::rstest_unwrap_outside_tests_still_fails_in_non_harness_code) | test(ui::rstest_empty_companion_does_not_exempt_parent_function) | (binary(ui) & test(=ui))) & not package(no_unwrap_or_else_panic) & not package(rstest_helper_should_be_fixture)) | test(acquire_places_the_lock_inside_the_effective_target_directory)"
test-group = "serial-dylint-ui"
retries = { backoff = "exponential", count = 2, delay = "5s" }
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Every `ui` test in this package rebuilds the lint library through nested
# Cargo. Match the whole package's own binary rather than a list of test
# names: the previous filter selected `ui::ui`, which no test here is called,
# so every harness fell to the 300 s base and two timed out at 300.006 s. See
# the ci profile's copy.
filter = "package(no_unwrap_or_else_panic) & binary(no_unwrap_or_else_panic)"
slow-timeout = { period = "75m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-dylint-ui"
retries = 0

[[profile.default.overrides]]
# This test builds both the fixture library and its example through nested
# Cargo. Keep its existing retry for transient UI failures, but give the cold
# build enough time to clear package-cache and compiler-admission queues.
filter = "package(rstest_helper_should_be_fixture) & (test(example_compiles_without_diagnostics) | test(example_harness_collects_call_site_evidence))"
test-group = "serial-dylint-ui"
retries = { backoff = "exponential", count = 2, delay = "5s" }
slow-timeout = { period = "75m", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# This fixture suite had not finished compiling after 75 minutes in a healthy
# but busy compiler queue. Allow one longer build without retrying it.
filter = "package(rstest_helper_should_be_fixture) & test(trybuild_fixtures_compile_without_diagnostics)"
slow-timeout = { period = "120m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-dylint-ui"
retries = 0

[[profile.default.overrides]]
# These parser-pin and no-default-feature cases run nested Cargo builds in
# isolated targets; a cold build may queue behind admitted compiler work.
filter = "binary(build_script_integration)"
slow-timeout = { period = "75m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-nested-cargo-builds"

[[profile.default.overrides]]
filter = "binary(no_default_features_build)"
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }
test-group = "serial-nested-cargo-builds"

[[profile.default.overrides]]
# Serialize ignored exclusion integration tests when they are explicitly run.
# They build and stage the lint library before invoking `cargo dylint`, so they
# share the same target-directory race risk as the UI harnesses above.
filter = "binary(integration_exclusion)"
test-group = "serial-dylint-ui"

# Extend the timeout for toolchain auto-install behavioural tests, since the
# isolated rustup setup may need to download and install a full nightly toolchain.
[[profile.default.overrides]]
filter = "binary(behaviour_toolchain)"
slow-timeout = { period = "30m", terminate-after = 1 }

# These three scenarios all invoke installer-driven lint builds and can
# contend on shared rustup/cargo state when run in parallel.
[[profile.default.overrides]]
filter = "binary(behaviour_toolchain) & (test(scenario_auto_detect_toolchain_install) | test(scenario_auto_install_success_emits_message) | test(scenario_auto_install_success_quiet_mode))"
test-group = "serial-toolchain-installs"

# Repository-specific formal terms, machine contracts and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # SARIF 2.1.0 (OASIS) spells these properties `artifactLocation` and
  # `artifacts`. The Rust fields use the repository's Oxford spelling and pin
  # the wire names with `serde(rename)`, so these two literals are serialized
  # values fixed by the external schema, not prose.
  "(?m)^    #\\[serde\\(rename = \"artifactLocation\"\\)\\]$",
  "(?m)^    #\\[serde\\(default, rename = \"artifacts\", skip_serializing_if = \"Vec::is_empty\"\\)\\]$",
  "(?m)^                !json\\.contains\\(\"\\\\\"artifacts\\\\\"\"\\),$",
  "(?m)^                json\\.contains\\(\"\\\\\"artifacts\\\\\"\"\\),$",
  "(?m)^                json\\.contains\\(\"\\\\\"artifactLocation\\\\\"\"\\),$",
  "(?m)^        \"\\-\\-artifact\\-server\\-path\",$",
  "(?m)^        let Message::CompilerArtifact\\(artefact\\) = message else \\{$",
  "(?m)^        let Ok\\(Message::CompilerArtifact\\(artefact\\)\\) = message else \\{$",
  "(?m)^        uses: actions/upload\\-artifact@v4$",
  "(?m)^        uses: actions/upload\\-artifact@v7$",
  "(?m)^      \\- Download all artefacts \\(actions/download\\-artifact@v4,$",
  "(?m)^      \\- Upload artefact \\(actions/upload\\-artifact@v4,$",
  "(?m)^    /// Categorises the input with a single cluster of conditional logic\\.$",
  "(?m)^    /// executed \\(catches mis\\-specified scenarios missing the When step\\)\\.$",
  "(?m)^    \\.help = Cuir beachd doc ris a tha a’ mìneachadh giùlan \\{ \\$function \\}\\.$",
  "(?m)^    \\.help = Cuir seachad `cap_std::fs::Dir` agus paramadairean `camino::Utf8Path`/`Utf8PathBuf` tron API seach std::fs a ghairm gu dìreach\\.$",
  "(?m)^    \\.label = Tha bump iom\\-fhillteachd \\{ \\$index \\} a’ leudachadh thairis air \\{ \\$lines \\} \\{ \\$lines \\->$",
  "(?m)^    \\.note = An\\-dràsta tha \\{ \\$branch_phrase \\} san riaghailt\\.$",
  "(?m)^    \\.note = Tha am buadh \\{ \\$attribute \\} a’ nochdadh mus am beachd doc\\.$",
  "(?m)^    \\.note = Tha an dùnadh a bheir thu do unwrap_or_else ag adhbhrachadh clisgeadh\\.$",
  "(?m)^    \\.note = Tha an gairm a’ tighinn bho \\{ \\$context \\} nach eil air aithneachadh mar dheuchainn\\.$",
  "(?m)^    \\.note = Tha an gnìomh air fhoillseachadh agus ri fhaicinn do chriotan eile\\.$",
  "(?m)^    \\.note = Tha mòidealan mòra nas duilghe an ath\\-sgrùdadh\\.$",
  "(?m)^    \\.note = Tha na docs airson \\{ \\$test \\} a’ gabhail a\\-steach ceann eisimpleirean no bloca còd le feansa\\.$",
  "(?m)^    \\.note = Tha teachdaireachdan airson \\{ \\$lint \\} ri fhaighinn ann an Gàidhlig\\.$",
  "(?m)^    artefact: &cargo_metadata::Artifact,$",
  "(?m)^    let _ = fixture::categorise\\(0\\);$",
  "(?m)^    let _ = fixture::categorise\\(4\\);$",
  "(?m)^    let _ = fixture::categorise\\(99\\);$",
  "(?m)^    pub fn categorise\\(input: i32\\) \\-> &'static str \\{$",
  "(?m)^    types: \\[opened, reopened, synchronize, labeled, ready_for_review\\]$",
  "(?m)^   = help: Cuir seachad `cap_std::fs::Dir` agus paramadairean `camino::Utf8Path`/`Utf8PathBuf` tron API seach std::fs a ghairm gu dìreach\\.$",
  "(?m)^  CARGO_TERM_COLOR: always$",
  "(?m)^  `download\\-artifact` merge step would clobber all but the last\\.$",
  "(?m)^# Borrowed English nouns typically pluralize with \\-iau \\(Modern Welsh, Gareth$",
  "(?m)^## Cuidhtearan breithneachaidh ga roinn thar linteran Whitaker\\.$",
  "(?m)^## Seachain `unwrap_or_else` a tha a’ clisgeadh\\.$",
  "(?m)^## Tha `expect` toirmisgte taobh a\\-muigh deuchainnean\\.$",
  "(?m)^#\\. Air a shealltainn ann an breithneachaidhean nuair a tha e a’ toirt iomradh air am buadh roimhe\\.$",
  "(?m)^\\- Lexical segment matching can mis\\-handle renamed imports, glob imports, or$",
  "(?m)^\\- \\*\\*Checkboxes:\\*\\* Precede task and sub\\-task items with a GitHub Flavored$",
  "(?m)^\\- `\\-\\-artifact\\-server\\-path <dir>`: export uploaded artefacts to a host$",
  "(?m)^bumpy_road_function = Tha iomadh cruinneachadh de loidsig chumhachail neadaichte ann an `\\{ \\$name \\}`\\.$",
  "(?m)^careful setup before a test can execute and, sometimes, teardown afterward\\.$",
  "(?m)^cargo dylint list \\-\\-color never \\| Where\\-Object \\{\\{$",
  "(?m)^cargo dylint list \\-\\-color never \\| awk \\-v suite=\"\\{suite_crate\\}\" '\\$0 ~ \"\\^\" suite \"\\(\\[\\[:space:\\]\\]\\|\\$\\)\" \\{\\{ print \\}\\}'$",
  "(?m)^error: Tha gnìomh std::fs `std::fs::read` a’ seachnadh a’ phoileasaidh comasan airson an t\\-siostaim fhaidhlichean\\.$",
  "(?m)^module_max_lines = Tha mòideal \\{ \\$module \\} a’ leudachadh gu \\{ \\$lines \\} loidhnichean agus a’ briseadh an crìoch \\{ \\$limit \\}\\.$",
  "(?m)^no_std_fs_operations = Tha gnìomh std::fs `\\{ \\$operation \\}` a’ seachnadh a’ phoileasaidh comasan airson an t\\-siostaim fhaidhlichean\\.$",
]

[files]
exclude = [
  "bad_main",
  "fail_match_with_nested_if",
  "libtest.rlib",
  "pass_single_match_cluster",
]

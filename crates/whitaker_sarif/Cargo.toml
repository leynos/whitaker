[package]
name = "whitaker_sarif"
version = "0.2.12"
edition = "2024"
publish = false
description = "SARIF 2.1.0 models, builders, and merge logic for Whitaker clone detection"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }

[dev-dependencies]
whitaker_test_macros = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
tempfile = { workspace = true }
trybuild = { workspace = true }
# Parses manifests for the architecture-fitness guard in
# `tests/architecture_boundary.rs`. Already a workspace dependency and already
# in `Cargo.lock`, so this adds no new external crate to the build.
toml = { workspace = true }
# The guard reads manifests through a capability-scoped handle rather than
# ambient `std::fs`, per the `no_std_fs_operations` lint. As with `toml` above,
# this is already a workspace dependency and already in `Cargo.lock`.
cap-std = { workspace = true }
# Generates arbitrary dependency trees for the scanner's precedence property.
# The invariant under test is over orderings and entry shapes, not over one
# example, so an example-based suite cannot state it. Already a workspace
# dependency and already in `Cargo.lock`.
proptest = { workspace = true }

[lints]
workspace = true

# Differential corpus for RFC 0013 (structural Bumpy Road detection).
#
# Each [[source]] is a Rust file; each [[source.case]] is one function in it.
# CodeScene is the reference (ADR 0011) and is NEVER called from tests. This
# file is refreshed by hand: remove the `@codescene` lines from a copy of each
# source, then run `cs review --output-format json <copy>` and record the
# verdict for the function.
#
# Columns per case:
#   regions            expected structural regions under RFC 0013's rules
#   weighted           outcome of the default weighted strategy today:
#                      "silent" or "flagged" (checked against the .stderr files)
#                      or "not-compiled" for reference-only sources
#   codescene_verdict  "clean" or "bumpy" (Bumpy Road Ahead finding)
#   codescene_bumps    CodeScene's `bumps` value when bumpy
#   mismatch           optional note: the documented disagreement, if any
#
# `sha256` is the digest of the committed source (with its `@codescene`
# lines). It records which bytes the observation describes. No test asserts it,
# so a reformat does not break the build; refresh it with the observation.

[codescene]
version = "1.0.36"
build = "5f703ce1f9c264701f32c795fa7104467f1e4ab4"
observed = "2026-11-16"
rule_configuration = "none (no .codescene/ rules; default Bumpy Road threshold of two nested conditional levels)"
governing_version_note = "1.0.58 is available but not installed; updating cs would rewrite the user's binary. Refresh on 1.0.58 when the user approves."


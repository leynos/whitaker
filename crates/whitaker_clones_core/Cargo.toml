[package]
name = "whitaker_clones_core"
version = "0.3.0"
edition = "2024"
publish = false
description = "Token and AST clone-detection primitives for Whitaker"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = ["parser"]
parser = ["dep:ra_ap_syntax"]
[dependencies]
thiserror = { workspace = true }
rustc_lexer = { workspace = true }
ra_ap_syntax = { workspace = true, optional = true }
sha2 = { workspace = true }
metrics = { workspace = true }
tracing = { workspace = true }
whitaker_sarif = { workspace = true }
# SARIF property bags are JSON values; the emitter builds them through the
# `whitaker_sarif` builders rather than by hand.
serde_json = { workspace = true }
# Arbitrary-precision unsigned arithmetic for the exact cosine kernel. The
# weights are `u128` fixed-point values whose squares exceed `u128`, so the
# acceptance decision needs exact products wider than native integers.
num-bigint = { workspace = true }

[dev-dependencies]
whitaker_test_macros = { workspace = true }
googletest = { workspace = true }
pretty_assertions = { workspace = true }
camino = { workspace = true }
cap-std = { workspace = true }
insta = { workspace = true }
metrics-util = { workspace = true }
proptest = { workspace = true }
semver = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
camino = { workspace = true }
cap-std = { workspace = true }
semver = { workspace = true }
toml = { workspace = true }
[lints]
workspace = true

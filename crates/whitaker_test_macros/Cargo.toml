[package]
name = "whitaker_test_macros"
version = "0.2.7"
edition = "2024"
publish = false
description = "Proc-macros for test fixtures that suppress lints triggered by macro expansion"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

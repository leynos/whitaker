[package]
name = "missing_docs_in_test_functions"
version.workspace = true
edition = "2024"
publish = false
description = "Dylint pre-expansion lint requiring documentation on test functions"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dylint-driver = [
    "dep:camino",
    "dep:dylint_linting",
    "dep:rustc_ast",
    "dep:rustc_lint",
    "dep:rustc_session",
    "dep:rustc_span",
    "dep:whitaker-common",
    "dep:whitaker_lint_core",
]
constituent = ["dylint-driver", "dylint_linting/constituent"]

[dependencies]
camino = { workspace = true, optional = true }
dylint_linting = { workspace = true, optional = true }
rustc_ast = { workspace = true, optional = true }
rustc_lint = { workspace = true, optional = true }
rustc_session = { workspace = true, optional = true }
rustc_span = { workspace = true, optional = true }
whitaker-common = { workspace = true, optional = true }
whitaker_lint_core = { workspace = true, features = ["dylint-driver"], optional = true }

[dev-dependencies]
camino = { workspace = true }
dylint_testing = { workspace = true }
googletest = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
serial_test = { workspace = true }
whitaker-common = { workspace = true }
whitaker_lint_core = { workspace = true }
whitaker_test_macros = { workspace = true }

[lints]
workspace = true

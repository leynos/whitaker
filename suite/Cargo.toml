[package]
name = "whitaker_suite"
version = "0.2.7"
edition = "2024"
publish = false
description = "Aggregated Whitaker Dylint suite cdylib"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dylint-driver = [
    "dep:dylint_linting",
    "dep:function_attrs_follow_docs",
    "dep:no_expect_outside_tests",
    "dep:test_must_not_have_example",
    "dep:module_must_have_inner_docs",
    "dep:conditional_max_n_branches",
    "dep:module_max_lines",
    "dep:no_unwrap_or_else_panic",
    "dep:no_std_fs_operations",
    "dep:bumpy_road_function",
    # Every experimental lint is compiled in so the prebuilt suite carries
    # them all. None runs until a repository opts in through
    # `[whitaker] experimental` in `dylint.toml` (ADR 0014).
    "dep:macro_aware_cognitive_complexity",
    "dep:rstest_helper_should_be_fixture",
    "dep:string_continuation_style",
    "dep:missing_docs_in_test_functions",
    "dep:rustc_hir",
    "dep:rustc_lint",
    "dep:rustc_session",
    "dep:rustc_span",
]
# Local `--experimental` builds: opt every experimental lint in by default.
# `dylint.toml` entries are still honoured and add nothing beyond this.
experimental-enable-all = ["dylint-driver"]
# Deprecated aliases kept for one release so callers that pass the old
# per-lint features keep building. The lints are always compiled in now.
experimental-macro-aware-cognitive-complexity = ["dylint-driver"]
experimental-missing-docs-in-test-functions = ["dylint-driver"]
experimental-rstest-helper-should-be-fixture = ["dylint-driver"]
experimental-string-continuation-style = ["dylint-driver"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
whitaker-common = { workspace = true }
dylint_linting = { workspace = true, optional = true }
rustc_lint = { workspace = true, optional = true }
rustc_session = { workspace = true, optional = true }
rustc_hir = { workspace = true, optional = true }
rustc_span = { workspace = true, optional = true }
function_attrs_follow_docs = { path = "../crates/function_attrs_follow_docs", optional = true, features = ["dylint-driver", "constituent"] }
no_expect_outside_tests = { path = "../crates/no_expect_outside_tests", optional = true, features = ["dylint-driver", "constituent"] }
test_must_not_have_example = { path = "../crates/test_must_not_have_example", optional = true, features = ["dylint-driver", "constituent"] }
module_must_have_inner_docs = { path = "../crates/module_must_have_inner_docs", optional = true, features = ["dylint-driver", "constituent"] }
conditional_max_n_branches = { path = "../crates/conditional_max_n_branches", optional = true, features = ["dylint-driver", "constituent"] }
module_max_lines = { path = "../crates/module_max_lines", optional = true, features = ["dylint-driver", "constituent"] }
no_unwrap_or_else_panic = { path = "../crates/no_unwrap_or_else_panic", optional = true, features = ["dylint-driver", "constituent"] }
no_std_fs_operations = { path = "../crates/no_std_fs_operations", optional = true, features = ["dylint-driver", "constituent"] }
bumpy_road_function = { path = "../crates/bumpy_road_function", optional = true, features = ["dylint-driver", "constituent"] }
string_continuation_style = { path = "../crates/string_continuation_style", optional = true, features = ["dylint-driver", "constituent"] }
missing_docs_in_test_functions = { path = "../crates/missing_docs_in_test_functions", optional = true, features = ["dylint-driver", "constituent"] }
rstest_helper_should_be_fixture = { path = "../crates/rstest_helper_should_be_fixture", optional = true, features = ["dylint-driver", "constituent"] }
macro_aware_cognitive_complexity = { path = "../crates/macro_aware_cognitive_complexity", optional = true, features = ["dylint-driver", "constituent"] }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
cargo_metadata = { workspace = true }
dylint_testing = { workspace = true }
whitaker_lint_core = { workspace = true }
whitaker_test_macros = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }

[lints]
workspace = true

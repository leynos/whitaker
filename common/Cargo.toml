[package]
name = "whitaker-common"
version = "0.3.0"
edition = "2024"
description = "Internal common utilities for Whitaker lints"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = []

[dependencies]

camino = { workspace = true }
fluent-templates = { workspace = true }
glob = "0.3.3"
log = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
temp-env = { workspace = true }
tempfile = "3.14.0"
thiserror = { workspace = true }
unic-langid = { workspace = true }

[dev-dependencies]
cap-std = { workspace = true }
# Matches the parser `fluent-templates` 0.15 embeds, so the catalogue parity
# gates accept exactly the syntax the loader accepts.
fluent-syntax = "0.12.0"
# Match the plural engine and locale negotiation `fluent-bundle` 0.16 uses, so
# the parity property tests consult the same plural rules the loader applies.
fluent-langneg = "0.14.2"
intl_pluralrules = "7.0.2"
whitaker_test_macros = { workspace = true }
trybuild = { workspace = true }
# Testing: Behavioural specs use rstest-bdd 0.5.x (workspace pin). Capture any
# regressions with `make test` and coordinate with the maintainers per
# `docs/rstest-bdd-users-guide.md` before gating behaviour tests or backporting
# fixes.
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
proptest = "1"
regex = "1.10.4"
logtest = "2.0.0"


[lints]
workspace = true
